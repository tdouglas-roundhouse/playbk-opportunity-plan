<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opportunity Plan</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#ffffff;--bg-secondary:#f5f4f1;--bg-tertiary:#eeede9;
  --bg-info:#e6f1fb;--bg-success:#eaf3de;--bg-warning:#faeeda;--bg-danger:#fcebeb;
  --text-primary:#1a1a18;--text-secondary:#5f5e5a;--text-tertiary:#888780;
  --text-info:#185fa5;--text-success:#3b6d11;--text-warning:#854f0b;--text-danger:#a32d2d;
  --border-light:rgba(0,0,0,0.10);--border-mid:rgba(0,0,0,0.18);--border-strong:rgba(0,0,0,0.28);
  --border-info:#b5d4f4;--border-success:#c0dd97;--border-warning:#fac775;--border-danger:#f7c1c1;
  --radius-md:8px;--radius-lg:12px;--font:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --green-pip:#1D9E75;--amber-pip:#EF9F27;
}
@media(prefers-color-scheme:dark){:root{
  --bg-primary:#1e1e1c;--bg-secondary:#27271f;--bg-tertiary:#2e2e26;
  --bg-info:#0c3352;--bg-success:#172f08;--bg-warning:#3d2406;--bg-danger:#3a1212;
  --text-primary:#f0efe8;--text-secondary:#b4b2a9;--text-tertiary:#888780;
  --text-info:#85b7eb;--text-success:#97c459;--text-warning:#ef9f27;--text-danger:#f09595;
  --border-light:rgba(255,255,255,0.08);--border-mid:rgba(255,255,255,0.14);--border-strong:rgba(255,255,255,0.22);
  --border-info:#185fa5;--border-success:#3b6d11;--border-warning:#854f0b;--border-danger:#a32d2d;
  --green-pip:#5DCAA5;--amber-pip:#FAC775;
}}
body{font-family:var(--font);background:var(--bg-secondary);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column}

/* ── Forecast badges ── */
.forecast-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.fc-commit{background:var(--bg-success);color:var(--text-success);border:0.5px solid var(--border-success)}
.fc-upside{background:var(--bg-info);color:var(--text-info);border:0.5px solid var(--border-info)}
.fc-pipeline{background:var(--bg-warning);color:var(--text-warning);border:0.5px solid var(--border-warning)}
.fc-omit{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}

/* ── App shell ── */
.app-shell{display:flex;flex:1;min-height:0}

/* ── Sidebar ── */
.sidebar{
  width:210px;flex-shrink:0;
  background:#1a2332;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar-brand{padding:20px 18px 14px;border-bottom:0.5px solid rgba(255,255,255,0.08);overflow:visible}
.sidebar-brand p{font-size:11px;color:rgba(255,255,255,0.4);margin-top:3px}
.sidebar-score{display:flex;align-items:center;gap:7px;margin-top:8px}
.sidebar-score .sc{font-size:12px;color:rgba(255,255,255,0.55)}
.save-indicator{font-size:11px;color:#5DCAA5;opacity:0;transition:opacity 0.4s;white-space:nowrap;margin-left:auto}
.save-indicator.show{opacity:1}

.sidebar-opp{padding:12px 14px 0}
.opp-bar{display:flex;flex-direction:column;gap:4px}
.opp-btn{font-size:12px;font-family:var(--font);padding:5px 10px;border-radius:6px;border:0.5px solid rgba(255,255,255,0.12);background:transparent;color:rgba(255,255,255,0.55);cursor:pointer;transition:all 0.15s;text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp-btn:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.85)}
.opp-btn.active{background:rgba(255,255,255,0.14);color:#ffffff;border-color:rgba(255,255,255,0.25);font-weight:500}
.add-opp-btn{font-size:12px;font-family:var(--font);padding:5px 10px;border-radius:6px;border:0.5px dashed rgba(255,255,255,0.18);background:transparent;color:rgba(255,255,255,0.35);cursor:pointer;text-align:left;width:100%;margin-top:2px}
.add-opp-btn:hover{color:rgba(255,255,255,0.65);border-color:rgba(255,255,255,0.35)}

.sidebar-nav{padding:14px 14px 0;flex:1;display:flex;flex-direction:column}
.sidebar-nav-label{font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.3);padding:8px 8px 4px}
.nav-pill{font-size:13px;font-family:var(--font);padding:8px 10px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,0.55);cursor:pointer;text-align:left;width:100%;transition:all 0.12s;display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap}
.nav-pill:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.9)}
.nav-pill.active{background:rgba(255,255,255,0.15);color:#ffffff;font-weight:500}
.nav-pip{width:6px;height:6px;border-radius:50%;background:#5DCAA5;flex-shrink:0;opacity:0}
.nav-pip.filled{opacity:1}

/* ── Content area ── */
.content-area{flex:1;padding:24px 28px 0;min-width:0;display:flex;flex-direction:column}

/* ── Slides ── */
.slide{display:none;background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-lg);padding:22px 24px 24px}
.slide.visible{display:block}
.slide-title{font-size:18px;font-weight:600;letter-spacing:-0.01em;margin-bottom:16px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.field-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.field-full{margin-bottom:10px}
.field-label{font-size:11px;color:var(--text-tertiary);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;gap:5px}
.fmt-hint{font-size:10px;color:var(--text-tertiary);font-weight:400;text-transform:none;letter-spacing:0;opacity:0.75}
.field-input{width:100%;font-size:13px;font-family:var(--font);color:var(--text-primary);background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:7px 10px;resize:none;outline:none;line-height:1.5;transition:border-color 0.15s}
.field-input:focus{border-color:var(--border-strong)}
.field-input::placeholder{color:var(--text-tertiary)}
.field-input.fmt-ok{border-color:var(--border-success)}
.field-input.fmt-err{border-color:var(--border-danger)}
select.field-input{cursor:pointer}
.sec-div{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);padding:14px 0 8px;border-top:0.5px solid var(--border-light);margin-top:4px}
.sec-div.first{border-top:none;margin-top:0;padding-top:0}
.chip-group{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;font-family:var(--font);padding:3px 10px;border-radius:4px;border:0.5px solid var(--border-mid);background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer;transition:all 0.1s}
.chip:hover{background:var(--bg-tertiary)}
.chip.sel-green{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success);font-weight:500}
.chip.sel-amber{background:var(--bg-warning);color:var(--text-warning);border-color:var(--border-warning);font-weight:500}
.chip.sel-red{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger);font-weight:500}
.chip.sel-blue{background:var(--bg-info);color:var(--text-info);border-color:var(--border-info);font-weight:500}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:10px}
.stk-card{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:12px 14px;position:relative;padding-bottom:32px;min-height:160px}
.role-badge{font-size:10px;font-weight:500;padding:2px 6px;border-radius:4px;margin-bottom:8px;display:inline-block}
.role-economic-buyer{background:var(--bg-info);color:var(--text-info);border:0.5px solid var(--border-info)}
.role-executive-sponsor{background:#2d1b69;color:#b794f4;border:0.5px solid #6b46c1}
.role-champion{background:var(--bg-success);color:var(--text-success);border:0.5px solid var(--border-success)}
.role-coach{background:var(--bg-warning);color:var(--text-warning);border:0.5px solid var(--border-warning)}
.role-blocker{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}
.role-neutral{background:var(--bg-tertiary);color:var(--text-secondary);border:0.5px solid var(--border-mid)}
.stk-input{background:transparent;border:none;outline:none;font-family:var(--font);width:100%}
.stk-name{font-size:13px;font-weight:500;color:var(--text-primary)}
.stk-sub{font-size:11px;color:var(--text-tertiary)}
.stk-win{font-size:11px;color:var(--text-secondary);border-bottom:0.5px solid var(--border-light);padding:3px 0;margin-top:4px}
.sc-remove{position:absolute;bottom:8px;right:8px;font-size:11px;color:var(--text-tertiary);background:none;border:none;cursor:pointer;font-family:var(--font)}
.sc-remove:hover{color:var(--text-danger)}
.pov-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pov-card{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:10px 12px}
.pov-q{font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.obj-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.obj-table th{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);padding:6px 10px;text-align:left;border-bottom:0.5px solid var(--border-mid)}
.obj-table td{padding:4px 10px;border-bottom:0.5px solid var(--border-light);vertical-align:top}
.obj-table tr:last-child td{border-bottom:none}
.obj-table td:first-child{color:var(--text-secondary);white-space:nowrap;font-weight:500}
.medd-score-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.medd-score-card{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:10px 12px;text-align:center}
.medd-score-card .lbl{font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px}
.medd-score-card .val{font-size:20px;font-weight:600;color:var(--text-primary);line-height:1}
.medd-section{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);margin-bottom:6px;overflow:hidden}
.medd-section-header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;user-select:none;transition:background 0.12s}
.medd-section-header:hover{background:var(--bg-tertiary)}
.medd-left{display:flex;align-items:center;gap:10px}
.medd-icon{width:28px;height:28px;border-radius:var(--radius-md);background:var(--bg-primary);border:0.5px solid var(--border-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.medd-icon svg{width:14px;height:14px;stroke:var(--text-tertiary);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.medd-title-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.medd-title{font-size:13px;font-weight:500}
.blocker-tag{font-size:10px;font-weight:500;color:var(--text-danger);background:var(--bg-danger);padding:2px 5px;border-radius:3px;border:0.5px solid var(--border-danger)}
.medd-desc{font-size:11px;color:var(--text-tertiary)}
.pip-row{display:flex;gap:3px;margin-top:3px}
.pip{width:7px;height:7px;border-radius:50%;background:var(--border-mid)}
.pip.filled{background:var(--green-pip)}
.pip.partial{background:var(--amber-pip)}
.chevron{width:14px;height:14px;flex-shrink:0;stroke:var(--text-tertiary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s}
.chevron.open{transform:rotate(180deg)}
.medd-body{border-top:0.5px solid var(--border-light);padding:4px 14px 12px}
.medd-question{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:0.5px solid var(--border-light)}
.medd-question:last-of-type{border-bottom:none}
.q-text{font-size:13px;line-height:1.5;flex:1}
.q-tag{font-size:10px;color:var(--text-tertiary);margin-top:2px}
.tog-group{display:flex;gap:4px;flex-shrink:0;margin-top:1px}
.tog{font-size:12px;font-family:var(--font);padding:3px 10px;border-radius:5px;border:0.5px solid var(--border-mid);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 0.1s}
.tog:hover{background:var(--bg-secondary)}
.tog.yes{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success);font-weight:500}
.tog.no{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger);font-weight:500}
.medd-notes{padding:6px 0 0}
.medd-notes textarea{width:100%;font-size:12px;font-family:var(--font);color:var(--text-primary);background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:6px 9px;resize:vertical;outline:none;line-height:1.5}
.medd-notes textarea:focus{border-color:var(--border-strong)}
.medd-notes textarea::placeholder{color:var(--text-tertiary)}
.gaps-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}
.gaps-table th{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);padding:5px 8px;text-align:left;border-bottom:0.5px solid var(--border-mid);white-space:nowrap}
.gaps-table td{padding:5px 8px;border-bottom:0.5px solid var(--border-light);vertical-align:middle}
.gaps-table tr:last-child td{border-bottom:none}
.gap-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;display:inline-block;white-space:nowrap}
.gap-blocker{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}
.gap-custom{background:var(--bg-warning);color:var(--text-warning);border:0.5px solid var(--border-warning)}
.gaps-table td input,.gaps-table td select{width:100%;font-size:12px;font-family:var(--font);color:var(--text-primary);background:transparent;border:none;outline:none;padding:2px 0;line-height:1.4}
.gaps-table td input::placeholder{color:var(--text-tertiary)}
.gaps-empty{font-size:12px;color:var(--text-success);padding:8px 0;display:flex;align-items:center;gap:6px}
.gaps-empty-dot{width:8px;height:8px;border-radius:50%;background:var(--green-pip);flex-shrink:0}
.gaps-add-btn{font-size:11px;font-family:var(--font);padding:4px 10px;border-radius:var(--radius-md);border:0.5px dashed var(--border-mid);background:transparent;color:var(--text-tertiary);cursor:pointer;margin-top:2px}
.gaps-add-btn:hover{color:var(--text-secondary)}
.gap-rm{font-size:11px;color:var(--text-tertiary);background:none;border:none;cursor:pointer;font-family:var(--font)}
.gap-rm:hover{color:var(--text-danger)}
.ask-box{background:var(--bg-warning);border:0.5px solid var(--border-warning);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px}
.ask-label{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-warning);margin-bottom:5px}
.ask-box textarea{background:transparent;border:none;color:var(--text-primary);font-size:13px;font-family:var(--font);width:100%;resize:none;outline:none;line-height:1.5}
.ask-box textarea::placeholder{color:var(--text-warning);opacity:0.6}
.map-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.map-table th{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);padding:6px 8px;text-align:left;border-bottom:0.5px solid var(--border-mid)}
.map-table td{padding:4px 8px;border-bottom:0.5px solid var(--border-light);vertical-align:top}
.map-table tr:last-child td{border-bottom:none}
.map-table td input,.map-table td select{width:100%;font-size:12px;font-family:var(--font);color:var(--text-primary);background:transparent;border:none;outline:none;padding:3px 0}
.map-table td input::placeholder{color:var(--text-tertiary)}
.add-row-btn{font-size:12px;font-family:var(--font);padding:5px 12px;border-radius:var(--radius-md);border:0.5px dashed var(--border-mid);background:transparent;color:var(--text-tertiary);cursor:pointer;margin-bottom:10px}
.add-row-btn:hover{color:var(--text-secondary)}
.ai-draft-btn{font-size:11px;font-family:var(--font);padding:4px 10px;border-radius:var(--radius-md);border:0.5px solid var(--border-info);background:var(--bg-info);color:var(--text-info);cursor:pointer;font-weight:500;transition:all 0.12s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.ai-draft-btn:hover{opacity:0.85}
.ai-draft-btn:disabled{opacity:0.5;cursor:not-allowed}

/* ── Talk button ── */
.talk-wrap{position:relative}
.talk-btn{position:absolute;bottom:8px;right:8px;width:28px;height:28px;border-radius:50%;border:none;background:var(--bg-secondary);border:0.5px solid var(--border-mid);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;z-index:2;padding:0;color:var(--text-tertiary)}
.talk-btn:hover{background:var(--bg-info);border-color:var(--border-info);color:var(--text-info)}
.talk-btn.recording{background:#fee2e2;border-color:#fca5a5;color:#dc2626;animation:pulse-red 1s infinite}
.talk-btn.processing{background:var(--bg-warning);border-color:var(--border-warning);color:var(--text-warning)}
.talk-btn svg{width:13px;height:13px;fill:currentColor}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0.3)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
.talk-coaching{margin-top:6px;padding:8px 10px;background:linear-gradient(135deg,var(--bg-info),rgba(29,158,117,0.06));border:0.5px solid var(--border-info);border-radius:var(--radius-md);font-size:12px;color:var(--text-info);line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.talk-coaching::before{content:'💬';font-size:13px;flex-shrink:0;margin-top:1px}
.talk-coaching strong{display:block;font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:3px}
.talk-status{font-size:11px;color:var(--text-tertiary);margin-top:4px;min-height:16px;transition:opacity 0.2s}
.call-summary-pill{font-size:12px;color:var(--text-secondary);background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:7px 10px;margin-bottom:10px;line-height:1.5}
.pov-required{font-size:10px;font-weight:500;color:var(--teal);background:rgba(29,158,117,0.1);padding:1px 6px;border-radius:4px;margin-left:6px;letter-spacing:0}
.pov-card-active{border-color:var(--border-info) !important;background:var(--bg-info) !important}
.slide-progress{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.prog-dot{width:8px;height:8px;border-radius:50%;background:var(--border-mid);cursor:pointer;transition:all 0.15s}
.prog-dot.active{background:var(--text-primary);transform:scale(1.2)}
.prog-dot.filled{background:var(--green-pip)}
.prog-nav{display:flex;gap:6px;margin-left:auto}
.prog-nav button{font-size:12px;font-family:var(--font);padding:4px 12px;border-radius:var(--radius-md);border:0.5px solid var(--border-mid);background:var(--bg-primary);color:var(--text-secondary);cursor:pointer}
.prog-nav button:hover{background:var(--bg-tertiary)}
.prog-nav button:disabled{opacity:0.35;cursor:default}
.main-wrap{flex:1;display:flex;flex-direction:column}
.bottom-bar{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;padding:0 0 32px}
.action-btn{font-size:13px;font-family:var(--font);padding:8px 16px;border-radius:var(--radius-md);border:0.5px solid var(--border-mid);background:var(--bg-primary);color:var(--text-primary);cursor:pointer;font-weight:500;transition:background 0.12s}
.action-btn:hover{background:var(--bg-tertiary)}
.action-btn.primary{background:#141f2e;color:#ffffff;border-color:#1a3a5c}
.action-btn.primary:hover{opacity:0.85}
/* ── Mobile top bar (hidden by default, shown on mobile) ── */
.mobile-topbar{
  display:none;
  background:#141f2e;
  padding:10px 16px;
  align-items:center;
  justify-content:space-between;
  position:sticky;top:0;z-index:90;
  flex-shrink:0;
}
.mobile-topbar-brand{display:flex;flex-direction:column}
.mobile-topbar-brand h1{font-size:14px;font-weight:600;color:#fff;letter-spacing:-0.01em}
.mobile-topbar-brand p{font-size:10px;color:rgba(255,255,255,0.4);margin-top:1px}
.hamburger-btn{
  width:36px;height:36px;
  background:rgba(255,255,255,0.08);
  border:none;border-radius:8px;
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:5px;padding:0;flex-shrink:0;

.hamburger-btn span{

/* ── Sidebar drawer overlay (shown via JS only) ── */
.sidebar-drawer{
  display:none;
  position:fixed;inset:0;z-index:200;
}

/* ── Mobile breakpoint ── */
@media(max-width:700px){
  .field-grid,.pov-grid{grid-template-columns:1fr}
  .field-grid-3{grid-template-columns:1fr 1fr}
  .medd-score-bar{grid-template-columns:repeat(2,1fr)}
  .log-summary{grid-template-columns:repeat(2,1fr)}
  .opp-cards{grid-template-columns:1fr}
  .waterfall-bars{grid-template-columns:repeat(2,1fr)}

  .sidebar{display:none !important}
  .mobile-topbar{display:flex !important}

}
.drawer-backdrop{
  position:absolute;inset:0;
  background:rgba(0,0,0,0.5);
}
.drawer-panel{
  position:absolute;left:0;top:0;bottom:0;
  width:260px;
  background:#1a2332;
  display:flex;flex-direction:column;
  overflow-y:auto;
  transform:translateX(-100%);

/* ── Dashboard ── */

.waterfall-total{display:flex;align-items:baseline;gap:10px;padding-top:14px;border-top:0.5px solid var(--border-light)}

.opp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:20px}

.opp-card-name{font-size:14px;font-weight:600;color:var(--text-primary);letter-spacing:-0.01em;line-height:1.3}
.opp-card-type{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.health-ring{width:48px;height:48px;flex-shrink:0}

.opp-card-stat .stat-val{font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.01em;line-height:1.2}

.opp-card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:0.5px solid var(--border-light)}
.medd-prog{flex:1;margin-right:12px}
.medd-prog-label{font-size:10px;color:var(--text-tertiary);margin-bottom:4px;display:flex;justify-content:space-between}

.opp-card-add{background:var(--bg-secondary);border:0.5px dashed var(--border-mid);border-radius:var(--radius-lg);padding:28px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all 0.15s;min-height:180px}

.onboarding{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72vh;text-align:center;padding:40px 24px}
.onboarding-icon{font-size:52px;margin-bottom:20px}
.onboarding-title{font-size:26px;font-weight:600;letter-spacing:-0.02em;margin-bottom:10px}
.onboarding-desc{font-size:14px;color:var(--text-secondary);line-height:1.65;max-width:440px;margin-bottom:28px}

.onboarding-step-text{font-size:12px;color:var(--text-secondary);line-height:1.5}
.onboarding-cta{font-size:14px;font-family:var(--font);padding:12px 28px;border-radius:var(--radius-md);border:none;background:#1a2332;color:#ffffff;cursor:pointer;font-weight:500;transition:opacity 0.15s}

.sidebar-health{display:flex;align-items:center;gap:8px;padding:12px 16px 16px;margin-top:auto}

.sidebar-health-score{font-size:20px;font-weight:700;margin-left:auto;letter-spacing:-0.02em}

.coaching-banner{background:linear-gradient(135deg,#0d1c2e,#1a3a5c);border:0.5px solid rgba(74,144,194,0.3);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:18px;position:relative;overflow:hidden}
.coaching-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#1a3a5c,#4a90c2,#1a3a5c);background-size:200% 100%;animation:shimmer 3s linear infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.coaching-banner-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.coaching-banner-title{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.45)}
.coaching-banner-refresh{font-size:10px;font-family:var(--font);background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;padding:0;transition:color 0.15s}

.coaching-actions{display:flex;flex-direction:column;gap:6px}

.coaching-action-item:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.12)}

.coaching-action-body{flex:1}
.coaching-action-text{font-size:12px;font-weight:500;color:rgba(255,255,255,0.85);line-height:1.4;margin-bottom:2px}
.coaching-action-why{font-size:11px;color:rgba(255,255,255,0.4);line-height:1.4}
.coaching-action-tag{font-size:9px;font-weight:600;letter-spacing:0.04em;color:#1D9E75;background:rgba(29,158,117,0.12);border-radius:3px;padding:1px 5px;margin-top:4px;display:inline-block}
.coaching-action-arrow{font-size:12px;color:rgba(255,255,255,0.2);flex-shrink:0;margin-top:2px}
.coaching-loading{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.35);font-size:12px;padding:4px 0}
.coaching-dot{width:5px;height:5px;border-radius:50%;background:#1D9E75;animation:blink 1.2s infinite}
.coaching-dot:nth-child(2){animation-delay:0.2s}
.coaching-dot:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,100%{opacity:0.3}50%{opacity:1}}
.call-entry{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);overflow:hidden}
.call-entry-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none}
.call-entry-header:hover{background:var(--bg-tertiary)}
.call-entry-meta{display:flex;align-items:center;gap:10px}
.call-date{font-size:12px;font-weight:500;color:var(--text-primary)}
.call-participants{font-size:11px;color:var(--text-tertiary)}
.call-finding-count{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--bg-info);color:var(--text-info);border:0.5px solid var(--border-info)}
.call-entry-body{border-top:0.5px solid var(--border-light);padding:12px 14px}
.call-transcript-preview{font-size:11px;color:var(--text-tertiary);font-family:monospace;background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:8px 10px;max-height:80px;overflow:hidden;margin-bottom:12px;white-space:pre-wrap;line-height:1.5}
.findings-list{display:flex;flex-direction:column;gap:6px}
.finding-card{border:0.5px solid var(--border-light);border-radius:var(--radius-md);overflow:hidden}
.finding-card.accepted{border-color:var(--border-success)}
.finding-card.rejected{opacity:0.45}
.finding-header{display:flex;align-items:flex-start;gap:10px;padding:10px 12px}
.finding-type{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;flex-shrink:0;margin-top:1px}
.ft-meddpicc{background:var(--bg-info);color:var(--text-info);border:0.5px solid var(--border-info)}
.ft-pov{background:var(--bg-warning);color:var(--text-warning);border:0.5px solid var(--border-warning)}
.ft-stakeholder{background:var(--bg-success);color:var(--text-success);border:0.5px solid var(--border-success)}
.ft-gap{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}
.ft-action{background:var(--bg-tertiary);color:var(--text-secondary);border:0.5px solid var(--border-mid)}
.ft-redflag{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}
.finding-body{flex:1}
.finding-title{font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:3px}
.finding-evidence{font-size:11px;color:var(--text-tertiary);font-style:italic;margin-bottom:4px;line-height:1.5}
.finding-suggestion{font-size:12px;color:var(--text-secondary)}
.finding-actions{display:flex;gap:6px;padding:0 12px 10px;justify-content:flex-end}
.finding-btn{font-size:12px;font-family:var(--font);padding:4px 12px;border-radius:var(--radius-md);border:0.5px solid var(--border-mid);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 0.1s}
.finding-btn.accept{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success);font-weight:500}
.finding-btn.reject{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger)}
.finding-btn:hover{opacity:0.8}
.analyse-btn{font-size:13px;font-family:var(--font);padding:9px 20px;border-radius:var(--radius-md);border:0.5px solid var(--text-primary);background:var(--text-primary);color:var(--bg-primary);cursor:pointer;font-weight:500;transition:opacity 0.15s;display:flex;align-items:center;gap:8px}
.analyse-btn:hover{opacity:0.85}
.analyse-btn:disabled{opacity:0.45;cursor:default}
.analyse-spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.call-form{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px}
.call-form-title{font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:12px}
.call-empty{font-size:13px;color:var(--text-tertiary);padding:24px 0;text-align:center}
.call-remove{font-size:11px;color:var(--text-tertiary);background:none;border:none;cursor:pointer;font-family:var(--font);padding:0}

.red-flag-box{background:var(--bg-danger);border:0.5px solid var(--border-danger);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:8px}
.coaching-section{margin-top:16px;padding-top:14px;border-top:0.5px solid var(--border-light)}
.coaching-header{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.coaching-header::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green-pip)}
.coaching-step{display:flex;gap:10px;padding:9px 12px;border-radius:var(--radius-md);background:var(--bg-primary);border:0.5px solid var(--border-light);margin-bottom:6px}
.coaching-step:last-child{margin-bottom:0}
.coaching-priority{flex-shrink:0;width:6px;height:6px;border-radius:50%;margin-top:5px}
.coaching-priority.high{background:#a32d2d}
.coaching-priority.medium{background:#EF9F27}
.coaching-body{flex:1}
.coaching-action{font-size:12px;font-weight:500;color:var(--text-primary);line-height:1.45;margin-bottom:2px}
.coaching-rationale{font-size:11px;color:var(--text-tertiary);line-height:1.4}
.coaching-tag{font-size:10px;font-weight:500;color:var(--text-tertiary);background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:4px;padding:1px 6px;margin-top:4px;display:inline-block;letter-spacing:0.03em}
.red-flag-label{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-danger);margin-bottom:4px}

.log-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:200;align-items:flex-start;justify-content:center;padding:40px 16px}
.log-overlay.open{display:flex}
.log-panel{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-lg);width:100%;max-width:820px;max-height:calc(100vh - 80px);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.18)}
.log-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:0.5px solid var(--border-light);flex-shrink:0}
.log-header h2{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.log-header-right{display:flex;gap:8px;align-items:center}
.log-close{font-size:13px;font-family:var(--font);padding:5px 12px;border-radius:var(--radius-md);border:0.5px solid var(--border-mid);background:transparent;color:var(--text-secondary);cursor:pointer}
.log-close:hover{background:var(--bg-tertiary)}
.log-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 20px;border-bottom:0.5px solid var(--border-light);flex-shrink:0}
.log-stat{text-align:center}
.log-stat .ls-val{font-size:20px;font-weight:600;color:var(--text-primary);line-height:1}
.log-stat .ls-lbl{font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;margin-top:3px}
.log-body{overflow-y:auto;flex:1;padding:12px 20px 20px}
.log-table{width:100%;border-collapse:collapse;font-size:13px}

.log-table tr.archived-row:hover td{background:var(--bg-secondary)}
.row-action{font-size:11px;font-family:var(--font);padding:3px 9px;border-radius:5px;border:0.5px solid var(--border-mid);background:transparent;color:var(--text-tertiary);cursor:pointer;white-space:nowrap;transition:all 0.1s}
.row-action:hover{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger)}
.row-action.restore:hover{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success)}
.archived-section-header{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);padding:16px 0 8px;border-top:0.5px solid var(--border-light);margin-top:8px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.archived-section-header:hover{color:var(--text-secondary)}
.delete-opp-btn{font-size:12px;font-family:var(--font);padding:6px 14px;border-radius:var(--radius-md);border:0.5px solid var(--border-danger);background:transparent;color:var(--text-danger);cursor:pointer;transition:all 0.12s}
.delete-opp-btn:hover{background:var(--bg-danger)}
.log-name{font-weight:500;color:var(--text-primary)}
.log-sub{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.log-arr{font-size:12px;color:var(--text-secondary)}
.log-arr-target{font-size:11px;color:var(--text-tertiary)}
.log-medd{font-size:12px;color:var(--text-secondary)}
.log-medd-bar{height:4px;border-radius:2px;background:var(--border-light);margin-top:4px;overflow:hidden;width:60px}
.log-medd-fill{height:100%;border-radius:2px;background:var(--green-pip);transition:width 0.3s}
.log-next{font-size:12px;color:var(--text-secondary)}

.log-open-btn{font-size:13px;font-family:var(--font);padding:8px 16px;border-radius:var(--radius-md);border:0.5px solid var(--border-success);background:var(--bg-success);color:var(--text-success);cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500;transition:opacity 0.12s}

@media(max-width:600px){
  .field-grid,.pov-grid{grid-template-columns:1fr}

  .app-shell{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-right:none;border-bottom:0.5px solid var(--border-light);padding:10px 12px;flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav-pill{width:auto;padding:5px 12px;font-size:12px}
  .nav-pip{display:none}
  .content-area{padding:16px 14px 40px}
  .medd-score-bar{grid-template-columns:repeat(2,1fr)}
  .log-summary{grid-template-columns:repeat(2,1fr)}
  .log-overlay{padding:0}
  .log-panel{max-height:100vh;border-radius:0}
}

/* ── Deal Conviction ─────────────────────────────── */
.conviction-card{background:var(--bg-secondary);border:0.5px solid var(--border-light);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:18px}
.conviction-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.conviction-card-title{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-tertiary)}
.conviction-questions{display:flex;flex-direction:row;align-items:center;gap:0;margin-bottom:10px;flex-wrap:nowrap}
.conviction-question{display:flex;align-items:center;gap:6px;padding:0 16px 0 0;flex-shrink:0}
.conviction-question:first-child{padding-left:0}
.conviction-q{font-size:12px;color:var(--text-secondary);font-weight:500;white-space:nowrap}
.conviction-sep{width:0.5px;height:20px;background:var(--border-mid);flex-shrink:0;margin-right:16px}
.conviction-badge{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px}
.conviction-badge.green{background:var(--bg-success);color:var(--text-success);border:0.5px solid var(--border-success)}
.conviction-badge.amber{background:var(--bg-warning,rgba(239,159,39,0.12));color:var(--text-warning,#b87800);border:0.5px solid var(--border-warning,rgba(239,159,39,0.4))}
.conviction-badge.red{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}
.conviction-badge.none{background:var(--bg-tertiary);color:var(--text-tertiary);border:0.5px solid var(--border-light)}
.conviction-chips{display:flex;gap:4px}
.conviction-chip{font-size:11px;font-weight:600;padding:5px 14px;border-radius:20px;border:1.5px solid var(--border-mid);background:var(--bg-primary);color:var(--text-tertiary);cursor:pointer;transition:all 0.15s;font-family:var(--font)}
.conviction-chip:hover{border-color:var(--text-secondary);color:var(--text-primary);background:var(--bg-secondary)}
.conviction-chip.sel-yes{background:#1D9E75;border-color:#1D9E75;color:#fff;box-shadow:0 2px 6px rgba(29,158,117,0.35)}
.conviction-chip.sel-uncertain{background:#EF9F27;border-color:#EF9F27;color:#fff;box-shadow:0 2px 6px rgba(239,159,39,0.35)}
.conviction-chip.sel-no{background:#c0392b;border-color:#c0392b;color:#fff;box-shadow:0 2px 6px rgba(192,57,43,0.35)}
.conviction-note{margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border-light)}
.conviction-note-label{font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:6px}
/* Modal — dark overlay, dark card (works in both modes) */
.conviction-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.conviction-modal{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-lg);padding:24px;max-width:440px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,0.18)}
.conviction-modal-title{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.conviction-modal-sub{font-size:12px;color:var(--text-secondary);margin-bottom:16px;line-height:1.5}
.conviction-modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.conviction-modal-save{background:#1D9E75;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
.conviction-modal-cancel{background:var(--bg-secondary);color:var(--text-secondary);border:0.5px solid var(--border-mid);border-radius:8px;padding:8px 18px;font-size:12px;cursor:pointer;font-family:var(--font)}
/* Sidebar conviction dot — sidebar is always dark so keep these */
.conviction-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.conviction-dot.green{background:#1D9E75}
.conviction-dot.amber{background:#EF9F27}
.conviction-dot.red{background:#e05252}
.conviction-dot.none{background:rgba(255,255,255,0.2)}
.sidebar-conviction{display:flex;align-items:center;gap:7px;margin-top:6px;padding:0 2px}
.sidebar-conviction-label{font-size:10px;color:rgba(255,255,255,0.35);font-weight:500;letter-spacing:0.04em}

</style>
</head>

function formatCurrency(raw) {
  if (!raw || !raw.trim()) return '';
  let s = raw.trim().replace(/,/g, '');
  const neg = s.startsWith('-');
  if (neg) s = s.slice(1);
  s = s.replace(/^\$\s*/, '');
  let num = null;
  const lower = s.toLowerCase();
  if (/^[\d.]+t$/.test(lower))      num = parseFloat(lower) * 1e12;
  else if (/^[\d.]+b$/.test(lower)) num = parseFloat(lower) * 1e9;
  else if (/^[\d.]+m$/.test(lower)) num = parseFloat(lower) * 1e6;
  else if (/^[\d.]+k$/.test(lower)) num = parseFloat(lower) * 1e3;
  else if (/^[\d.]+$/.test(lower))  num = parseFloat(lower);
  if (num === null || isNaN(num)) return raw;
  if (neg) num = -num;
  const abs = Math.abs(num);
  if (abs >= 1e12) return '$' + (num / 1e12).toFixed(num % 1e12 === 0 ? 0 : 1) + 'T';
  if (abs >= 1e9)  return '$' + (num / 1e9).toFixed(num % 1e9 === 0 ? 0 : 1) + 'B';
  if (abs >= 1e6)  return '$' + (num / 1e6).toFixed(num % 1e6 === 0 ? 0 : 1) + 'M';
  if (abs >= 1e3)  return '$' + (num / 1e3).toFixed(num % 1e3 === 0 ? 0 : 1) + 'K';
  return '$' + Math.round(num).toLocaleString();
}

function formatQuarter(raw) {
  if (!raw || !raw.trim()) return '';
  const s = raw.trim();
  if (/^Q[1-4]\s+20\d{2}$/.test(s)) return s;
  const m = s.match(/[qQ]?([1-4])[\s\-\/]*(20)?(\d{2,4})/);
  if (m) {
    let yr = m[3];
    if (yr.length === 2) yr = '20' + yr;
    return 'Q' + m[1] + ' ' + yr;
  }
  const qonly = s.match(/^[qQ]([1-4])$/);
  if (qonly) return 'Q' + qonly[1] + ' ' + new Date().getFullYear();
  return raw;
}

function formatDate(raw) {
  if (!raw || !raw.trim()) return '';
  const s = raw.trim();
  // Already mm/dd/yy or mm/dd/yyyy
  if (/^\d{1,2}\/\d{1,2}\/\d{2}$/.test(s)) return s;
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) {
    const parts = s.split('/');
    return parts[0].padStart(2,'0') + '/' + parts[1].padStart(2,'0') + '/' + parts[2].slice(2);
  }
  // Try parsing any reasonable date string
  const d = new Date(s);
  if (!isNaN(d.getTime())) {
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const yy = String(d.getFullYear()).slice(2);
    return mm + '/' + dd + '/' + yy;
  }
  return raw;
}

function isDateValid(f) {
  return /^\d{2}\/\d{2}\/\d{2}$/.test(f);
}

function isCurrencyValid(f) {
  return /^\$[\d.]+[KMBT]?$/.test(f) || /^\$[\d,]+$/.test(f);
}
function isQuarterValid(f) {
  return /^Q[1-4]\s+20\d{2}$/.test(f);
}

function applyFmt(el, formatted, valid) {
  el.value = formatted;
  el.classList.toggle('fmt-ok', valid && formatted !== '');
  el.classList.toggle('fmt-err', !valid && formatted !== '');
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

function attachFormatter(el, type) {
  if (!el) return;
  el.addEventListener('blur', () => {
    if (type === 'currency') {
      const f = formatCurrency(el.value);
      applyFmt(el, f, isCurrencyValid(f));
    } else if (type === 'quarter') {
      const f = formatQuarter(el.value);
      applyFmt(el, f, isQuarterValid(f));
    } else if (type === 'date') {
      const f = formatDate(el.value);
      applyFmt(el, f, isDateValid(f));
    }
  });
  el.addEventListener('focus', () => {
    el.classList.remove('fmt-ok', 'fmt-err');
  });
}

function attachFormatters() {
  ['snapshot.currentArr', 'snapshot.targetArr'].forEach(path => {

  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 60) return mins <= 1 ? 'Just now' : mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  return days === 1 ? 'Yesterday' : days + 'd ago';
}

async function publishDeck() {
  const btn = document.querySelector('[onclick="publishDeck()"]');
  if (btn) { btn.textContent = '⏳ Building deck…'; btn.disabled = true; }

  try {
    const response = await fetch('/api/deck', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ opp: opp() })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({ error: { message: response.statusText } }));
      throw new Error(err.error?.message || 'Deck generation failed');
    }

    const buffer = await response.arrayBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (opp().name || 'Deal_Review').replace(/\s+/g, '_') + '_Deal_Review.pptx';
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) {
    showModal({ title: 'Deck generation failed', desc: e.message, confirmLabel: 'OK', onConfirm: () => {} });
  } finally {
    if (btn) { btn.textContent = '▶ Publish Deal Review'; btn.disabled = false; }
  }
}

/* ================================================================
   HEALTH SCORE  0–100
   40% MEDDPICC overall | 30% blocker sections | 20% plan completeness | 10% recency
   ================================================================ */

function calcHealthScore(oppData) {
  const data = oppData || d();
  const ma = (data.meddpicc && data.meddpicc.meddAnswers) || {};

  // 40% — overall MEDDPICC
  let mYes = 0, mTotal = 0;
  MEDD.forEach(s => s.questions.forEach((_, i) => { mTotal++; if (ma[s.id + '_' + i] === 'yes') mYes++; }));
  const meddPct = mTotal ? mYes / mTotal : 0;

  // 30% — blocker sections (penalise hard: each weak blocker -1/4)
  const blockers = MEDD.filter(s => s.blocker);
  let bYes = 0, bTotal = 0;
  blockers.forEach(s => s.questions.forEach((_, i) => { bTotal++; if (ma[s.id + '_' + i] === 'yes') bYes++; }));
  const blockerPct = bTotal ? bYes / bTotal : 0;

  // 20% — plan completeness (5 fields, 4% each)
  let complete = 0;
  if (data.snapshot.firmName)                         complete++;
  if (data.stakeholders && data.stakeholders.length)  complete++;
  if (data.accountpov && data.accountpov.whyChange)   complete++;
  if (data.opppov && data.opppov.whitespace)          complete++;
  if (data.map && data.map.topAsk)                    complete++;
  const completePct = complete / 5;

  // 10% — recency (next touch set = 0.5, last engagement set = 0.5)
  let recency = 0;
  if (data.map && data.map.nextTouch)       recency += 0.5;
  if (data.map && data.map.lastEngagement)  recency += 0.5;

  // Conviction modifier (+5 all yes, -10 any no)
  const conv = d().conviction || {};
  const convAnswers = [conv.deal, conv.win, conv.play];
  let convMod = 0;
  if (convAnswers.every(a => a === 'yes'))    convMod = 5;
  else if (convAnswers.some(a => a === 'no')) convMod = -10;

  const score = Math.round(meddPct * 40 + blockerPct * 30 + completePct * 20 + recency * 10 + convMod);
  return Math.max(0, Math.min(100, score));
}

function healthRingSVG(score, size, stroke) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const fill = (score / 100) * circ;
  const color = score >= 70 ? '#1D9E75' : score >= 40 ? '#EF9F27' : '#a32d2d';
  const cx = size / 2, cy = size / 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;transform:rotate(-90deg)">
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="${stroke}"/>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
    stroke-dasharray="${fill} ${circ}" stroke-linecap="round"/>
</svg>`;
}

function healthRingSVGLight(score, size, stroke) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const fill = (score / 100) * circ;
  const color = score >= 70 ? '#1D9E75' : score >= 40 ? '#EF9F27' : '#a32d2d';
  const track = score >= 70 ? '#c0dd97' : score >= 40 ? '#fac775' : '#f7c1c1';
  const cx = size / 2, cy = size / 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;transform:rotate(-90deg)">
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
    stroke-dasharray="${fill} ${circ}" stroke-linecap="round"/>
</svg>`;
}

/* ================================================================
   PIPELINE WATERFALL HELPERS
   ================================================================ */

function parseARR(str) {
  if (!str) return 0;
  const s = str.trim();
  const n = parseFloat(s.replace(/[^0-9.]/g, ''));
  if (isNaN(n)) return 0;
  if (/T$/i.test(s)) return n * 1e12;
  if (/B$/i.test(s)) return n * 1e9;
  if (/M$/i.test(s)) return n * 1e6;
  if (/K$/i.test(s)) return n * 1e3;
  return n;
}

function fmtARR(n) {
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + Math.round(n / 1e3) + 'K';
  return n > 0 ? '$' + n : '—';
}

function oppForecast(a) {
  const ma = (a.data.meddpicc && a.data.meddpicc.meddAnswers) || {};
  const bl = MEDD.filter(s => s.blocker);
  let bY = 0, bT = 0, tY = 0, tQ = 0;
  bl.forEach(s => s.questions.forEach((_, i) => { bT++; if (ma[s.id + '_' + i] === 'yes') bY++; }));
  MEDD.forEach(s => s.questions.forEach((_, i) => { tQ++; if (ma[s.id + '_' + i] === 'yes') tY++; }));
  const p = tY / tQ, bp = bY / bT;
  if (bp >= 0.75 && p >= 0.70) return 'Commit';
  if (bp >= 0.55 && p >= 0.50) return 'Upside';
  if (p >= 0.25 || tY >= 5) return 'Pipeline';
  return 'Omit';
}

/* ================================================================
   DASHBOARD BUILDER
   ================================================================ */

function buildDashboard() {
  if (opps.length === 0) return buildOnboarding();

  // Waterfall data
  const buckets = { Commit: { arr: 0, count: 0 }, Upside: { arr: 0, count: 0 }, Pipeline: { arr: 0, count: 0 }, Omit: { arr: 0, count: 0 } };
  opps.filter(a => !a.archived).forEach(a => {
    const fc = oppForecast(a);
    const arr = parseARR(a.data.snapshot.targetArr);
    buckets[fc].arr += arr;
    buckets[fc].count++;
  });
  const totalARR = Object.values(buckets).reduce((s, b) => s + b.arr, 0);
  const maxBucket = Math.max(...Object.values(buckets).map(b => b.arr), 1);

  const wfColors = {
    Commit:   { fill: '#1D9E75', track: 'rgba(29,158,117,0.15)' },
    Upside:   { fill: '#185fa5', track: 'rgba(24,95,165,0.12)'  },
    Pipeline: { fill: '#EF9F27', track: 'rgba(239,159,39,0.15)' },
    Omit:     { fill: 'var(--border-strong)', track: 'var(--border-light)' }
  };

  const wfBars = ['Commit', 'Upside', 'Pipeline', 'Omit'].map(fc => {
    const b = buckets[fc];
    const pct = Math.max(Math.round((b.arr / maxBucket) * 100), b.count > 0 ? 6 : 0);
    const c = wfColors[fc];
    return `<div class="wf-bar">
  <div class="wf-bar-label">${fc}</div>
  <div class="wf-bar-track" style="background:${c.track}">
    <div class="wf-bar-fill" style="width:${pct}%;background:${c.fill}"></div>
  </div>
  <div class="wf-bar-arr">${b.arr > 0 ? fmtARR(b.arr) : '<span style="color:var(--text-tertiary);font-size:14px">—</span>'}</div>
  <div class="wf-bar-count">${b.count} opp${b.count !== 1 ? 's' : ''}</div>
</div>`;
  }).join('');

  const cards = opps.filter(a => !a.archived).map((a) => {
    const idx = opps.indexOf(a);
    const hs = calcHealthScore(a.data);
    const hsColor   = hs >= 70 ? '#1D9E75' : hs >= 40 ? '#EF9F27' : '#a32d2d';
    const hsTextCol = hs >= 70 ? 'var(--text-success)' : hs >= 40 ? 'var(--text-warning)' : 'var(--text-danger)';
    const fc      = oppForecast(a);
    const fcClass = FC_CLASS[fc] || 'fc-omit';
    const ma = (a.data.meddpicc && a.data.meddpicc.meddAnswers) || {};
    let mYes = 0, mTotal = 0;
    MEDD.forEach(s => s.questions.forEach((_, i) => { mTotal++; if (ma[s.id + '_' + i] === 'yes') mYes++; }));
    const meddPct = mTotal ? Math.round((mYes / mTotal) * 100) : 0;
    const s         = a.data.snapshot;
    const champion  = a.data.stakeholders.find(st => st.role === 'Champion');
    const nextTouch = a.data.map.nextTouch || '—';

    // Ring with score centred inside
    const size = 52, stroke = 3, r = (size - stroke) / 2;
    const circ = 2 * Math.PI * r, fillArc = (hs / 100) * circ;
    const ring = `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);position:absolute;top:0;left:0">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border-light)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${hsColor}" stroke-width="${stroke}"
      stroke-dasharray="${fillArc.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"/>
  </svg>
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:${hsTextCol};letter-spacing:-0.02em">${hs}</div>
</div>`;

    return `<div class="opp-card" onclick="openOpp(${idx})">
  <div class="opp-card-top">
    <div style="flex:1;min-width:0">
      <div class="opp-card-name">${esc(a.name)}</div>
      <div class="opp-card-type">${esc(s.firmType || 'Prospect')}${s.aum ? ' · ' + esc(s.aum) : ''}</div>
    </div>
    ${ring}
  </div>
  <div class="opp-card-mid" style="grid-template-columns:1fr 1fr 1fr">
    <div class="opp-card-stat">
      <div class="stat-label">Target ARR</div>
      <div class="stat-val">${esc(s.targetArr || '—')}</div>
      <div class="stat-sub">${s.currentArr ? esc(s.currentArr) + ' current' : 'Not set'}</div>
    </div>
    <div class="opp-card-stat">
      <div class="stat-label">Next touch</div>
      <div class="stat-val" style="font-size:12px;font-weight:500;line-height:1.4">${esc(nextTouch)}</div>
      <div class="stat-sub">${champion && champion.name ? 'Champ: ' + esc(champion.name) : 'No champion'}</div>
    </div>
    <div class="opp-card-stat">
      <div class="stat-label">Last updated</div>
      <div class="stat-val" style="font-size:11px;font-weight:500">${a.updatedAt ? new Date(a.updatedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '—'}</div>
      <div class="stat-sub">${a.updatedAt ? timeSince(a.updatedAt) : 'Never opened'}</div>
    </div>
  </div>
  <div class="opp-card-footer">
    <div class="medd-prog">
      <div class="medd-prog-label"><span>MEDDPICC</span><span>${mYes}/${mTotal}</span></div>
      <div class="medd-prog-track"><div class="medd-prog-fill" style="width:${meddPct}%"></div></div>
    </div>
    <span class="forecast-badge ${fcClass}" style="flex-shrink:0">${fc}</span>
  </div>
</div>`;
  }).join('');

  const activeOpps = opps.filter(a => !a.archived);
  return `<div class="slide-title">Opportunity Dashboard</div>
<div class="dash-subtitle" style="font-size:13px;color:var(--text-tertiary);margin-top:-10px;margin-bottom:18px">${activeOpps.length} opportunit${activeOpps.length !== 1 ? 'ies' : 'y'} · ${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
<div class="waterfall">
  <div class="waterfall-title">Target ARR by forecast</div>
  <div class="waterfall-bars">${wfBars}</div>
  <div class="waterfall-total">
    <span class="wf-total-label">Total pipeline</span>
    <span class="wf-total-arr">${totalARR > 0 ? fmtARR(totalARR) : '—'}</span>
    <span class="wf-total-sub">target ARR · ${opps.length} opp${opps.length !== 1 ? 's' : ''}</span>
  </div>
</div>
<div class="opp-cards">
  ${cards}
  <div class="opp-card-add" onclick="addOpp()">
    <div class="opp-card-add-plus">+</div>
    <div class="opp-card-add-label">Add opportunity</div>
  </div>
</div>`;
}

function buildMeddpiccSlide() {
  const { yes, total } = calcScore();
  const fc = calcForecast();
  const blockerWeak = MEDD.filter(s => s.blocker && meddStatus(s.id, s.questions.length) === 'low').length;
  return `${oppNameBadge()}<div class="slide-title">Qualification</div>

  <div class="medd-score-card"><div class="lbl">Sections green</div><div class="val">${MEDD.filter(s => meddStatus(s.id, s.questions.length) === 'full').length}/7</div></div>
  <div class="medd-score-card"><div class="lbl">Blockers weak</div><div class="val" style="color:${blockerWeak > 0 ? 'var(--text-danger)' : 'var(--text-success)'}">${blockerWeak > 0 ? blockerWeak + ' weak' : 'Clear'}</div></div>
  <div class="medd-score-card"><div class="lbl">Forecast</div><div class="val" style="font-size:14px;padding-top:3px"><span class="forecast-badge ${FC_CLASS[fc]}">${fc}</span></div></div>
</div>
${MEDD.map(s => buildMeddSection(s)).join('')}
<div class="sec-div">Opportunity gaps & actions to close</div>
<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:8px">Blocker sections below 50% surface automatically.</div>
${buildGapsTable()}
<button class="gaps-add-btn" onclick="addGapRow()">+ Add gap manually</button>`;
}

function buildMeddSection(s) {
  const isOpen = opp().openMedd.has(s.id);
  const a = (d().meddpicc && d().meddpicc.meddAnswers) || {};
  const notes = (d().meddpicc && d().meddpicc.meddNotes) || {};
  const yes = meddYes(s.id, s.questions.length);
  const total = s.questions.length;
  const status = meddStatus(s.id, total);
  const pips = Array.from({ length: total }, (_, i) => `<span class="pip ${i < yes ? (status === 'full' ? 'filled' : 'partial') : ''}"></span>`).join('');
  let body = '';
  if (isOpen) {
    body = '<div class="medd-body">';
    s.questions.forEach((q, i) => {
      const key = s.id + '_' + i;
      const val = a[key] || '';
      body += `<div class="medd-question">
  <div><div class="q-text">${q.text}</div><div class="q-tag">${q.tag}</div></div>
  <div class="tog-group">
    <button class="tog ${val === 'yes' ? 'yes' : ''}" onclick="setMeddAnswer('${s.id}',${i},'yes')">Yes</button>
    <button class="tog ${val === 'no' ? 'no' : ''}" onclick="setMeddAnswer('${s.id}',${i},'no')">No</button>
  </div>
</div>`;
    });
    body += `<div class="medd-notes"><textarea rows="2" placeholder="Notes for ${s.title.toLowerCase()}…" onchange="setMeddNote('${s.id}',this.value)">${esc(notes[s.id] || '')}</textarea></div>`;
    body += '</div>';
  }
  return `<div class="medd-section">

function buildGapsTable() {
  const ma = (d().meddpicc && d().meddpicc.meddAnswers) || {};
  const ov = (d().meddpicc && d().meddpicc.gapOverrides) || {};
  const manual = (ov.__manual || []);
  const autoRows = MEDD.filter(s => s.blocker && meddYes(s.id, s.questions.length) < Math.ceil(s.questions.length / 2));
  if (autoRows.length === 0 && manual.length === 0) {
    return `<div class="gaps-empty"><span class="gaps-empty-dot"></span>No weak blocker sections — all critical areas at 50%+ confirmed.</div>`;
  }
  let html = `<table class="gaps-table"><thead><tr>
    <th style="width:110px">Section</th><th>Gap</th><th>Action to close</th>
    <th style="width:66px">Owner</th><th style="width:60px">By</th><th style="width:20px"></th>
  </tr></thead><tbody>`;
  autoRows.forEach(s => {
    html += `<tr>
  <td><span class="gap-badge gap-blocker">${s.title}</span></td>
  <td><input data-gap="${s.id}_gap" value="${esc(ov[s.id + '_gap'] || '')}" placeholder="What's missing?"></td>
  <td><input data-gap="${s.id}_action" value="${esc(ov[s.id + '_action'] || '')}" placeholder="Next step to resolve"></td>

  <td><input data-gap="${s.id}_by" value="${esc(ov[s.id + '_by'] || '')}" placeholder="Jun 1"></td>
  <td></td>
</tr>`;
  });
  manual.forEach((r, i) => {
    html += `<tr>
  <td><span class="gap-badge gap-custom">${esc(r.section || 'Custom')}</span></td>
  <td><input data-mgap="${i}_gap" value="${esc(r.gap || '')}" placeholder="What's missing?"></td>

  <td><input data-mgap="${i}_by" value="${esc(r.by || '')}" placeholder="Jun 1"></td>
  <td><button class="gap-rm" onclick="removeGapRow(${i})">×</button></td>
</tr>`;
  });
  html += '</tbody></table>';
  return html;
}

function attachListeners() {
  document.querySelectorAll('[data-f]').forEach(el => {
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
      setDeep(el.getAttribute('data-f'), el.value);
      renderHeaderScore();
    });
  });
  document.querySelectorAll('[data-stk]').forEach(el => {
    el.addEventListener('input', () => {
      const [i, field] = el.getAttribute('data-stk').split('.');
      if (d().stakeholders[+i]) d().stakeholders[+i][field] = el.value;
    });
  });
  document.querySelectorAll('[data-map]').forEach(el => {
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
      const [i, field] = el.getAttribute('data-map').split('.');
      if (!d().map.rows[+i]) d().map.rows[+i] = {};
      d().map.rows[+i][field] = el.value;
    });
  });
  document.querySelectorAll('[data-biz]').forEach(el => {
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
      const [i, field] = el.getAttribute('data-biz').split('.');
      if (!d().bizasks) d().bizasks = { rows: [] };
      if (!d().bizasks.rows[+i]) d().bizasks.rows[+i] = {};
      d().bizasks.rows[+i][field] = el.value;
    });
  });
  document.querySelectorAll('[data-gap]').forEach(el => {
    el.addEventListener('input', () => {
      if (!d().meddpicc.gapOverrides) d().meddpicc.gapOverrides = { __manual: [] };
      d().meddpicc.gapOverrides[el.getAttribute('data-gap')] = el.value;
    });
  });
  document.querySelectorAll('[data-mgap]').forEach(el => {
    el.addEventListener('input', () => {
      const [i, field] = el.getAttribute('data-mgap').split('_');
      const m = d().meddpicc.gapOverrides.__manual;
      if (m && m[+i]) m[+i][field] = el.value;
    });
  });
}

function setDeep(path, val) {
  const parts = path.split('.');
  let obj = d();
  for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
  obj[parts[parts.length - 1]] = val;
}
function toggleMedd(id) {
  const s = opp().openMedd;
  if (s.has(id)) s.delete(id); else s.add(id);
  renderCurrentSlide();
  renderHeaderScore();
}
function setMeddAnswer(sid, qi, val) {
  const key = sid + '_' + qi;
  const a = d().meddpicc.meddAnswers;
  if (a[key] === val) delete a[key]; else a[key] = val;
  renderCurrentSlide();
  renderHeaderScore();
}
function toggleMeddNote(sid) {
  if (!opp().openMedd) opp().openMedd = new Set();
  // Open the section to the note
  if (!opp().openMedd.has(sid)) {
    opp().openMedd.add(sid);
  }
  // Focus the note textarea after render
  render();
  setTimeout(() => {
    const el = document.querySelector('.medd-body textarea');
    if (el) el.focus();
  }, 50);
}

function removeStakeholder(i) { d().stakeholders.splice(i, 1); render(); }
function setStkField(i, f, v) { if (d().stakeholders[i]) d().stakeholders[i][f] = v; }
function addMapRow() { if (!d().map.rows) d().map.rows = []; d().map.rows.push({ date: '', ownerEleven: '', ownerAccount: '', action: '', status: 'Open' }); render(); }
function addGapRow() {

function showModal({ title, desc = '', input = false, placeholder = '', defaultVal = '', confirmLabel = 'OK', danger = false, onConfirm }) {
  const modal   = document.getElementById('inlineModal');
  const mTitle  = document.getElementById('modalTitle');
  const mDesc   = document.getElementById('modalDesc');
  const mInput  = document.getElementById('modalInput');
  const mCancel = document.getElementById('modalCancel');
  const mConf   = document.getElementById('modalConfirm');

  mTitle.textContent = title;
  mDesc.textContent  = desc;
  mConf.textContent  = confirmLabel;
  mConf.style.background    = danger ? 'var(--text-danger)'  : '';
  mConf.style.borderColor   = danger ? 'var(--border-danger)': '';

  if (input) {
    mInput.style.display  = 'block';
    mInput.placeholder    = placeholder;
    mInput.value          = defaultVal;
    setTimeout(() => mInput.focus(), 80);
  } else {
    mInput.style.display = 'none';
  }

  modal.style.display = 'flex';

  // Handlers — clone to remove old listeners
  const newConf   = mConf.cloneNode(true);
  const newCancel = mCancel.cloneNode(true);
  mConf.parentNode.replaceChild(newConf, mConf);
  mCancel.parentNode.replaceChild(newCancel, mCancel);

  newConf.textContent = confirmLabel;
  newConf.style.cssText = danger
    ? 'font-size:13px;background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger)'
    : 'font-size:13px';
  newConf.className = 'action-btn' + (danger ? '' : ' primary');

  newConf.onclick = () => {
    const val = input ? document.getElementById('modalInput').value.trim() : true;
    closeModal();
    if (val || !input) onConfirm(val);
  };
  newCancel.onclick = closeModal;

  // Enter key submits
  if (input) {
    document.getElementById('modalInput').onkeydown = (e) => {
      if (e.key === 'Enter') newConf.click();
      if (e.key === 'Escape') closeModal();
    };
  }

  // Tap backdrop to cancel
  modal.onclick = (e) => { if (e.target === modal) closeModal(); };
}

function closeModal() {
  document.getElementById('inlineModal').style.display = 'none';
}

function addOpp() {
  showModal({
    title: 'New opportunity',
    desc: 'Enter the firm or prospect name.',
    input: true,
    placeholder: 'e.g. Strauss Family Office',
    confirmLabel: 'Create',
    onConfirm: (name) => {

      opps.push({ name, currentSlide: 1, openMedd: new Set(['economic_buyer']), data: freshData(), updatedAt: Date.now() });

/* ================================================================
   EXPORT — CSV
   Two sheets encoded as separate CSV blocks separated by a blank
   line and a header row: (1) Opportunity summary, (2) MEDDPICC detail.
   Opens cleanly in Excel, Numbers, and Google Sheets.
   ================================================================ */

function csvCell(v) {
  const s = (v == null ? '' : String(v)).replace(/"/g, '""');
  return /[,"\n\r]/.test(s) ? '"' + s + '"' : s;
}
function csvRow(arr) { return arr.map(csvCell).join(',') + '\r\n'; }

function exportPlan() {
  let csv = '';

  // ── Sheet 1: Opportunity summary (one row per opportunity) ──
  csv += csvRow(['ELEVEN SYSTEMS — OPPORTUNITY PLAN EXPORT', 'Generated: ' + new Date().toLocaleDateString()]);
  csv += '\r\n';
  csv += csvRow([
    'Opportunity', 'Type', 'AUM', 'Journey', 'Health',
    'Current ARR', 'Target ARR', 'Renewal / Close',
    'Forecast', 'MEDDPICC Score', 'MEDDPICC %', 'Weak Blockers',
    'Why Change', 'Why Now', 'Why Eleven', 'Solution / Value',
    'Incumbents', 'Competitive Strategy',
    'Champion', 'Economic Buyer', 'Stakeholder Count',
    '#1 Ask', 'Next Touch', 'Last Engagement',
    'Obj 1', 'Obj 1 Date', 'Obj 2', 'Obj 2 Date', 'Obj 3', 'Obj 3 Date',
    'Context / Notes'
  ]);

  opps.forEach(a => {
    const s  = a.data.snapshot;
    const p  = a.data.accountpov;
    const o  = a.data.opppov;
    const m  = a.data.map;
    const ma = o.meddAnswers || {};

    // Score
    let yes = 0, total = 0;
    MEDD.forEach(ms => ms.questions.forEach((_, i) => {
      total++;
      if (ma[ms.id + '_' + i] === 'yes') yes++;
    }));
    const bl = MEDD.filter(sec => sec.blocker);
    let bY = 0, bT = 0;
    bl.forEach(ms => ms.questions.forEach((_, i) => { bT++; if (ma[ms.id + '_' + i] === 'yes') bY++; }));
    const pct = yes / total, bp = bY / bT;
    let fc = 'Omit';
    if (bp >= 0.75 && pct >= 0.70) fc = 'Commit';
    else if (bp >= 0.55 && pct >= 0.50) fc = 'Upside';
    else if (pct >= 0.25 || yes >= 5) fc = 'Pipeline';

    const weakBlockers = MEDD.filter(ms => ms.blocker &&
      ms.questions.filter((_, i) => ma[ms.id + '_' + i] === 'yes').length < Math.ceil(ms.questions.length / 2)
    ).map(ms => ms.title).join('; ');

    const champion = a.data.stakeholders.find(st => st.role === 'Champion');
    const eb       = a.data.stakeholders.find(st => st.role === 'Economic buyer');

    csv += csvRow([
      a.name, s.firmType, s.aum, s.journey, s.healthStatus,
      s.currentArr, s.targetArr, s.renewalQ,
      fc, yes + '/' + total, Math.round(pct * 100) + '%', weakBlockers || 'None',
      p.whyChange, p.whyNow, p.whyUs, p.whatSolution,
      o.incumbents, o.competitiveStrategy,
      champion ? champion.name + ' (' + champion.sentiment + ')' : '',
      eb        ? eb.name + ' (' + eb.sentiment + ')' : '',
      a.data.stakeholders.length,
      m.topAsk, m.nextTouch, m.lastEngagement,
      p.objective1, p.obj1date, p.objective2, p.obj2date, p.objective3, p.obj3date,
      s.notes
    ]);
  });

  // ── Sheet 2: MEDDPICC detail (one row per section per opportunity) ──
  csv += '\r\n';
  csv += csvRow(['MEDDPICC DETAIL']);
  csv += csvRow(['Opportunity', 'Section', 'Blocker', 'Score', 'Q1', 'Q2', 'Q3', 'Q4', 'Notes']);

  opps.forEach(a => {
    const ma    = a.data.meddpicc.meddAnswers || {};
    const notes = a.data.meddpicc.meddNotes   || {};
    MEDD.forEach(ms => {
      const answers = ms.questions.map((_, i) => ma[ms.id + '_' + i] === 'yes' ? 'Yes' : ma[ms.id + '_' + i] === 'no' ? 'No' : '');
      const sectionYes = answers.filter(v => v === 'Yes').length;
      csv += csvRow([
        a.name, ms.title, ms.blocker ? 'Yes' : 'No',
        sectionYes + '/' + ms.questions.length,
        ...answers,
        notes[ms.id] || ''
      ]);
    });
  });

  // ── Sheet 3: Gaps (one row per gap per opportunity) ──
  csv += '\r\n';
  csv += csvRow(['OPPORTUNITY GAPS']);
  csv += csvRow(['Opportunity', 'Section', 'Type', 'Gap', 'Action to Close', 'Owner', 'By']);

  opps.forEach(a => {
    const ma = a.data.meddpicc.meddAnswers  || {};
    const ov = a.data.meddpicc.gapOverrides || {};
    MEDD.filter(ms => ms.blocker &&
      ms.questions.filter((_, i) => ma[ms.id + '_' + i] === 'yes').length < Math.ceil(ms.questions.length / 2)
    ).forEach(ms => {
      csv += csvRow([
        a.name, ms.title, 'Blocker',
        ov[ms.id + '_gap']    || '',
        ov[ms.id + '_action'] || '',
        ov[ms.id + '_owner']  || '',
        ov[ms.id + '_by']     || ''
      ]);
    });
    (ov.__manual || []).forEach(r => {
      csv += csvRow([a.name, r.section || 'Custom', 'Manual', r.gap || '', r.action || '', r.owner || '', r.by || '']);
    });
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'eleven_opportunity_plan_' + new Date().toISOString().slice(0, 10) + '.csv';
  link.click();
}

/* ================================================================
   OPPORTUNITY LOG
   Uses localStorage so the log persists across browser sessions.
   Key: 'eleven_opp_log'  Value: JSON array of log entries.
   ================================================================ */

function getLog() {
  try { return JSON.parse(localStorage.getItem('eleven_opp_log') || '[]'); }
  catch(e) { return []; }
}
function setLog(entries) {
  try { localStorage.setItem('eleven_opp_log', JSON.stringify(entries)); }
  catch(e) {}
}

function deriveStage(journey, yes, total, meddAnswers) {
  // Stage is derived: explicit journey field if set, otherwise inferred from qualification depth
  if (journey) return journey;
  const pct = total ? yes / total : 0;
  if (pct >= 0.65) return 'Expand';
  if (pct >= 0.35) return 'Land';
  return 'Land';
}

function buildLogEntry(a) {
  const s  = a.data.snapshot;
  const m  = a.data.map;
  const ma = (a.data.meddpicc && a.data.meddpicc.meddAnswers) || {};
  let yes = 0, total = 0;
  MEDD.forEach(ms => ms.questions.forEach((_, i) => {
    total++;
    if (ma[ms.id + '_' + i] === 'yes') yes++;
  }));
  const bl = MEDD.filter(sec => sec.blocker);
  let bY = 0, bT = 0;
  bl.forEach(ms => ms.questions.forEach((_, i) => { bT++; if (ma[ms.id + '_' + i] === 'yes') bY++; }));
  const p = yes / total, bp = bT ? bY / bT : 0;
  let fc = 'Omit';
  if (bp >= 0.75 && p >= 0.70) fc = 'Commit';
  else if (bp >= 0.55 && p >= 0.50) fc = 'Upside';
  else if (p >= 0.25 || yes >= 5) fc = 'Pipeline';
  const stage = deriveStage(s.journey, yes, total, ma);
  return {
    id:          a.id || (a.id = Date.now() + '_' + Math.random().toString(36).slice(2)),
    name:        a.name,
    firmType:    s.firmType    || '',
    aum:         s.aum         || '',
    currentArr:  s.currentArr  || '',
    targetArr:   s.targetArr   || '',
    healthStatus:s.healthStatus|| '',
    journey:     stage,
    renewalQ:    s.renewalQ    || '',
    meddScore:   yes,
    meddTotal:   total,
    forecast:    fc,
    nextTouch:   m.nextTouch   || '',
    topAsk:      m.topAsk      || '',
    savedAt:     new Date().toISOString()
  };
}

function saveToLog() {
  // Ensure the current opp has a stable id
  if (!opps[currentOpp].id) opps[currentOpp].id = Date.now() + '_' + Math.random().toString(36).slice(2);
  const entry = buildLogEntry(opps[currentOpp]);
  const log = getLog();
  const idx = log.findIndex(e => e.id === entry.id);
  if (idx >= 0) log[idx] = entry;  // update existing
  else log.unshift(entry);          // prepend new
  setLog(log);
  updateLogCount();
  // Flash save indicator
  const ind = document.getElementById('saveIndicator');
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 2000);
}

function updateLogCount() {
  // Count badge now lives in the sidebar nav pill — re-render sidebar
  renderSidebar();
}

  <td>
    <div class="log-name">${esc(e.name)}</div>
    <div class="log-sub">${esc(e.aum || '—')}${e.firmType ? ' · ' + esc(e.firmType) : ''}</div>
  </td>
  <td>
    ${e.journey ? `<span class="forecast-badge ${stageClass}" style="font-size:11px;padding:2px 9px">${esc(e.journey)}</span>` : '—'}
  </td>
  <td>
    <div class="log-arr">${esc(e.targetArr || '—')}</div>
    <div class="log-arr-target">${e.currentArr && e.currentArr !== '$0' ? 'from ' + esc(e.currentArr) : 'new logo'}</div>
  </td>
  <td>
    <div class="log-medd">${e.meddScore}/${e.meddTotal}</div>
    <div class="log-medd-bar"><div class="log-medd-fill" style="width:${pct}%"></div></div>
  </td>
  <td><span class="forecast-badge ${fcClass}" style="font-size:11px;padding:2px 9px">${e.forecast}</span></td>
  <td><span style="font-size:11px;color:var(--text-secondary)">${esc(e.renewalQ || '—')}</span></td>
  <td><span class="log-next">${esc(e.nextTouch || '—')}</span></td>
  <td><span class="log-updated">${saved}</span></td>
  <td>${action}</td>
</tr>`;
  };

  const activeRows  = active.map(e => makeRow(e, false)).join('');
  const archivedRows = archived.map(e => makeRow(e, true)).join('');

  const emptyActive = active.length === 0
    ? `<div style="text-align:center;padding:32px 0;color:var(--text-tertiary);font-size:13px">No saved opportunities yet. Open any opportunity plan and hit <strong>Save to Log</strong>.</div>`

function archiveOpp(id) {
  const log = getLog();
  const idx = log.findIndex(e => e.id === id);
  if (idx >= 0) {
    log[idx].archived = true;
    setLog(log);
  }
  // Also mark in opps array
  const oi = opps.findIndex(o => o.id === id);
  if (oi >= 0) opps[oi].archived = true;
  renderCurrentSlide();
  updateLogCount();
}

function restoreOpp(id) {
  const log = getLog();
  const idx = log.findIndex(e => e.id === id);
  if (idx >= 0) {
    log[idx].archived = false;
    setLog(log);
  }
  const oi = opps.findIndex(o => o.id === id);
  if (oi >= 0) opps[oi].archived = false;
  renderCurrentSlide();
  updateLogCount();
}

function toggleArchivedSection() {
  const rows = document.getElementById('archivedRows');
  const chev = document.getElementById('archivedChevron');
  if (!rows) return;
  const open = rows.style.display === 'block';
  rows.style.display = open ? 'none' : 'block';
  if (chev) chev.textContent = open ? '▸' : '▾';
}

function deleteOpp() {
  if (!opp()) return;
  const name = opp().name;
  showModal({
    title: 'Delete opportunity',
    desc: `Permanently delete "${name}"? This cannot be undone.`,
    confirmLabel: 'Delete',
    danger: true,
    onConfirm: () => {
      const log = getLog();
      const id = opp().id;
      setLog(log.filter(e => e.id !== id));
      opps.splice(currentOpp, 1);
      currentOpp = Math.max(0, currentOpp - 1);
      if (opps.length === 0) showDashboard = true;
      render();
    }
  });
}

function jumpToOpp(id) {
  const idx = opps.findIndex(o => o.id === id);
  if (idx >= 0) {
    showPipeline = false;
    showDashboard = false;
    currentOpp = idx;
    opps[idx].currentSlide = 1;
    render();
  } else {
    alert('This opportunity is in the log but not open in this session. Re-open and save it to re-link.');
  }
}
