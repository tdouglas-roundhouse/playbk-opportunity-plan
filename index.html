/* ════════════ Stakeholder relationship map ════════════ */
const mapState = { view: 'cards', mode: 'select', selected: null, connectSrc: null,
  drag: null, dragOff: { x: 0, y: 0}, didDrag: false };
const REL_COLOR = { 'reports-to': 'var(--border-strong)', 'allies-with': '#1D9E75', 'blocks': '#a32d2d' };
const REL_DASH  = { 'reports-to': '0', 'allies-with': '0', 'blocks': '5 4' };
const REL_TYPES = ['reports-to', 'allies-with', 'blocks'];
const SVGNS = 'http://www.w3.org/2000/svg';

function setStkView(v) { mapState.view = v; mapState.connectSrc = null; render(); }
function setMapMode(m) { mapState.mode = m; mapState.connectSrc = null; render(); }

function stkSentColors(sent) {
  if (sent === 'Advocate') return { stroke: 'var(--green-pip)', fill: 'var(--bg-success)' };
  if (sent === 'Risk')     return { stroke: '#a32d2d',          fill: 'var(--bg-danger)'  };
  return { stroke: 'var(--amber-pip)', fill: 'var(--bg-warning)' };
}
function roleChip(role) {
  const r = (role || '').toLowerCase();
  if (r === 'champion')        return { bg: 'var(--bg-success)', tx: 'var(--text-success)', label: 'CHAMPION' };
  if (r === 'economic buyer')  return { bg: 'var(--bg-info)',    tx: 'var(--text-info)',    label: 'ECON BUYER' };
  if (r === 'executive sponsor') return { bg: '#2d1b69',         tx: '#b794f4',             label: 'EXEC SPONSOR' };
  if (r === 'coach')           return { bg: 'var(--bg-warning)', tx: 'var(--text-warning)', label: 'COACH' };
  if (r === 'blocker')         return { bg: 'var(--bg-danger)',  tx: 'var(--text-danger)',  label: 'BLOCKER' };
  return { bg: 'var(--bg-tertiary)', tx: 'var(--text-secondary)', label: (role || 'NEUTRAL').toUpperCase() };
}
function nodeRadius(inf) { return 20 + (inf == null ? 3 : inf) * 5; } // 25 → 45
function mEl(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

/* Auto-layout any stakeholder missing x/y so first render isn't a pile-up */
function ensureLayout() {
  const stk = d().stakeholders;
  const svg = document.getElementById('stkMapSvg');
  const W = svg ? svg.clientWidth  || 640 : 640;
  const H = svg ? svg.clientHeight || 440 : 440;
  const unplaced = stk.filter(s => s.x == null || s.y == null);
  if (unplaced.length) {
    // simple tier layout: buyers/sponsors top, champions/coaches mid, others bottom
    const tier = s => {
      const r = (s.role || '').toLowerCase();
      if (r === 'economic buyer' || r === 'executive sponsor') return 0;
      if (r === 'champion' || r === 'coach') return 1;
      return 2;
    };
    const tiers = [[], [], []];
    stk.forEach((s, i) => { if (s.x == null || s.y == null) tiers[tier(s)].push(i); });
    tiers.forEach((idxs, t) => {
      const y = 90 + t * ((H - 160) / 2);
      idxs.forEach((idx, k) => {
        stk[idx].x = (W / (idxs.length + 1)) * (k + 1);
        stk[idx].y = y;
      });
    });
  }
}

function renderStakeholderMap() {
  const svg = document.getElementById('stkMapSvg');
  if (!svg) return;
  ensureLayout();
  const stk = d().stakeholders;
  const edges = d().edges || [];
  svg.innerHTML = '';

  // arrowhead defs
  const defs = mEl('defs', {});
  REL_TYPES.forEach(t => {
    const m = mEl('marker', { id: 'mk-' + t, viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse' });
    m.appendChild(mEl('path', { d: 'M0,0 L10,5 L0,10 z', fill: REL_COLOR[t] }));
    defs.appendChild(m);
  });
  svg.appendChild(defs);

  // edges
  edges.forEach(e => {
    const a = stk[e.from], b = stk[e.to];
    if (!a || !b) return;
    const ra = nodeRadius(a.influence), rb = nodeRadius(b.influence);
    const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy) || 1;
    const ux = dx / dist, uy = dy / dist;
    const x1 = a.x + ux * ra, y1 = a.y + uy * ra, x2 = b.x - ux * (rb + 7), y2 = b.y - uy * (rb + 7);
    svg.appendChild(mEl('line', { x1, y1, x2, y2, class: 'map-edge', stroke: REL_COLOR[e.type], 'stroke-width': 1.8, 'stroke-dasharray': REL_DASH[e.type], 'marker-end': 'url(#mk-' + e.type + ')' }));
    const lbl = mEl('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 3, class: 'map-edge-lbl', 'text-anchor': 'middle' });
    lbl.textContent = e.type; svg.appendChild(lbl);
  });

  // nodes
  stk.forEach((s, i) => {
    const r = nodeRadius(s.influence);
    const col = stkSentColors(s.sentiment || 'Neutral');
    const g = mEl('g', { class: 'node-g' + (mapState.mode === 'connect' ? ' connect-mode' : ''), 'data-idx': i });

    if (mapState.selected === i || mapState.connectSrc === i) {
      g.appendChild(mEl('circle', { cx: s.x, cy: s.y, r: r + 5, fill: 'none', stroke: 'var(--text-info)', 'stroke-width': 2, 'stroke-dasharray': '4 3' }));
    }
    g.appendChild(mEl('circle', { cx: s.x, cy: s.y, r, fill: col.fill, stroke: col.stroke, 'stroke-width': 2.5 }));

    const initials = (s.name || '?').split(' ').map(w => w[0]).filter(Boolean).slice(0, 2).join('').toUpperCase() || '?';
    const ini = mEl('text', { x: s.x, y: s.y, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'node-initials', style: `font-size:${11 + (s.influence||3)}px;fill:${col.stroke}` });
    ini.textContent = initials; g.appendChild(ini);

    // role chip
    const chip = roleChip(s.role);
    const cw = chip.label.length * 5 + 12;
    g.appendChild(mEl('rect', { x: s.x - cw / 2, y: s.y - r - 19, width: cw, height: 14, rx: 7, fill: chip.bg, stroke: chip.tx, 'stroke-width': 0.5, 'stroke-opacity': 0.5 }));
    const ct = mEl('text', { x: s.x, y: s.y - r - 12, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'node-chip-tx', fill: chip.tx });
    ct.textContent = chip.label; g.appendChild(ct);

    // name + title below
    const nm = mEl('text', { x: s.x, y: s.y + r + 14, 'text-anchor': 'middle', class: 'node-name' });
    nm.textContent = s.name || 'Unnamed'; g.appendChild(nm);
    if (s.title) { const tt = mEl('text', { x: s.x, y: s.y + r + 26, 'text-anchor': 'middle', class: 'node-title' }); tt.textContent = s.title; g.appendChild(tt); }

    svg.appendChild(g);
  });

  bindMapEvents();
}

function bindMapEvents() {
  const svg = document.getElementById('stkMapSvg');
  if (!svg) return;
  svg.querySelectorAll('.node-g').forEach(g => {
    const idx = +g.getAttribute('data-idx');
    g.addEventListener('mousedown', ev => {
      if (mapState.mode === 'connect') return;
      const pt = mapPoint(ev); const s = d().stakeholders[idx];
      mapState.drag = idx; mapState.didDrag = false;
      mapState.dragOff = { x: pt.x - s.x, y: pt.y - s.y };
      ev.preventDefault();
    });
    g.addEventListener('click', () => {
      if (mapState.mode === 'connect') { handleConnect(idx); return; }
      if (mapState.didDrag) return;
      selectMapNode(idx);
    });
  });
}
function mapPoint(ev) { const svg = document.getElementById('stkMapSvg'); const r = svg.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }

function onMapMove(ev) {
  if (mapState.drag == null) return;
  const pt = mapPoint(ev); const s = d().stakeholders[mapState.drag];
  s.x = Math.max(40, pt.x - mapState.dragOff.x);
  s.y = Math.max(40, pt.y - mapState.dragOff.y);
  mapState.didDrag = true;
  renderStakeholderMap();
}
function onMapUp() { if (mapState.drag != null) { mapState.drag = null; } }
document.addEventListener('mousemove', onMapMove);
document.addEventListener('mouseup', onMapUp);

function selectMapNode(idx) {
  mapState.selected = idx;
  render();
  // scroll the matching card into view + flash
  setTimeout(() => {
    const card = document.getElementById('stkcard_' + idx);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 30);
}

function handleConnect(idx) {
  if (mapState.connectSrc == null) { mapState.connectSrc = idx; renderStakeholderMap(); return; }
  if (mapState.connectSrc === idx) { mapState.connectSrc = null; renderStakeholderMap(); return; }
  pendingEdge = { from: mapState.connectSrc, to: idx };
  openRelPicker();
}
let pendingEdge = null;
function openRelPicker() {
  const stk = d().stakeholders;
  const a = stk[pendingEdge.from], b = stk[pendingEdge.to];
  const existing = (d().edges || []).find(e => e.from === pendingEdge.from && e.to === pendingEdge.to);
  const reverse  = !existing && (d().edges || []).find(e => e.from === pendingEdge.to && e.to === pendingEdge.from);
  const choices = REL_TYPES.map(t =>
    `<button class="action-btn" style="display:block;width:100%;text-align:left;margin-bottom:7px" onclick="commitEdge('${t}')">
      <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${REL_COLOR[t]};margin-right:8px;vertical-align:middle"></span>${t}${existing && existing.type === t ? ' ✓' : ''}
    </button>`).join('');
  const removeBtn = (existing || reverse)
    ? `<button class="action-btn" style="width:100%;margin-top:4px;color:var(--text-danger)" onclick="removeEdge()">Remove link${reverse ? ' (' + esc(b.name || 'target') + ' → ' + esc(a.name || 'source') + ')' : ''}</button>`
    : '';
  const titlePrefix = existing ? 'Edit link' : 'Link';
  showRelModal(`${titlePrefix}: ${esc(a.name || 'Unnamed')} → ${esc(b.name || 'Unnamed')}`, choices + removeBtn + `<button class="action-btn" style="width:100%;margin-top:4px" onclick="cancelEdge()">Cancel</button>`);
}
function commitEdge(type) {
  if (!d().edges) d().edges = [];
  d().edges = d().edges.filter(e => !(e.from === pendingEdge.from && e.to === pendingEdge.to));
  d().edges.push({ from: pendingEdge.from, to: pendingEdge.to, type });
  pendingEdge = null; mapState.connectSrc = null; closeRelModal(); render();
}
function cancelEdge() { pendingEdge = null; mapState.connectSrc = null; closeRelModal(); render(); }
function removeEdge() {
  if (d().edges && pendingEdge) {
    d().edges = d().edges.filter(e =>
      !((e.from === pendingEdge.from && e.to === pendingEdge.to) ||
        (e.from === pendingEdge.to && e.to === pendingEdge.from)));
  }
  pendingEdge = null; mapState.connectSrc = null; closeRelModal(); render();
}

/* dedicated map picker overlay — separate from the app's #inlineModal */

    <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:14px">${title}</div>${bodyHtml}</div>`;
  document.body.appendChild(ov);

function deleteMapRow(i) { if (!d().map.rows) return; d().map.rows.splice(i, 1); render(); }

/* ================================================================
   INLINE MODAL — mobile-safe replacement for prompt() / confirm()
   ================================================================ */

function showModal({ title, desc = '', input = false, placeholder = '', defaultVal = '', confirmLabel = 'OK', danger = false, onConfirm }) {
  const modal   = document.getElementById('inlineModal');
  const mTitle  = document.getElementById('modalTitle');
  const mDesc   = document.getElementById('modalDesc');
  const mInput  = document.getElementById('modalInput');
  const mCancel = document.getElementById('modalCancel');
  const mConf   = document.getElementById('modalConfirm');

  mTitle.textContent = title;
  mDesc.textContent  = desc;
  mConf.textContent  = confirmLabel;
  mConf.style.background    = danger ? 'var(--text-danger)'  : '';
  mConf.style.borderColor   = danger ? 'var(--border-danger)': '';

  if (input) {
    mInput.style.display  = 'block';
    mInput.placeholder    = placeholder;
    mInput.value          = defaultVal;
    setTimeout(() => mInput.focus(), 80);
  } else {
    mInput.style.display = 'none';
  }

  modal.style.display = 'flex';

  // Handlers — clone to remove old listeners
  const newConf   = mConf.cloneNode(true);
  const newCancel = mCancel.cloneNode(true);
  mConf.parentNode.replaceChild(newConf, mConf);
  mCancel.parentNode.replaceChild(newCancel, mCancel);

  newConf.textContent = confirmLabel;
  newConf.style.cssText = danger
    ? 'font-size:13px;background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger)'
    : 'font-size:13px';
  newConf.className = 'action-btn' + (danger ? '' : ' primary');

  newConf.onclick = () => {
    const val = input ? document.getElementById('modalInput').value.trim() : true;
    closeModal();
    if (val || !input) onConfirm(val);
  };
  newCancel.onclick = closeModal;

  // Enter key submits
  if (input) {
    document.getElementById('modalInput').onkeydown = (e) => {
      if (e.key === 'Enter') newConf.click();
      if (e.key === 'Escape') closeModal();
    };
  }

  // Tap backdrop to cancel
  modal.onclick = (e) => { if (e.target === modal) closeModal(); };
}

function closeModal() {
  document.getElementById('inlineModal').style.display = 'none';
}

function addOpp() {
  showModal({
    title: 'New opportunity',
    desc: 'Enter the firm or prospect name.',
    input: true,
    placeholder: 'e.g. Strauss Family Office',
    confirmLabel: 'Create',
    onConfirm: (name) => {
      if (!name) return;
      opps.push({ name, currentSlide: 1, openMedd: new Set(['economic_buyer']), data: freshData(), updatedAt: Date.now() });
      currentOpp = opps.length - 1;
      showDashboard = false;
      showPipeline = false;
      render();
    }
  });
}

/* ================================================================
   EXPORT — CSV
   Two sheets encoded as separate CSV blocks separated by a blank
   line and a header row: (1) Opportunity summary, (2) MEDDPICC detail.
   Opens cleanly in Excel, Numbers, and Google Sheets.
   ================================================================ */

function csvCell(v) {
  const s = (v == null ? '' : String(v)).replace(/"/g, '""');
  return /[,"\n\r]/.test(s) ? '"' + s + '"' : s;
}
function csvRow(arr) { return arr.map(csvCell).join(',') + '\r\n'; }

function exportPlan() {
  let csv = '';

  // ── Sheet 1: Opportunity summary (one row per opportunity) ──
  csv += csvRow(['ELEVEN SYSTEMS — OPPORTUNITY PLAN EXPORT', 'Generated: ' + new Date().toLocaleDateString()]);
  csv += '\r\n';
  csv += csvRow([
    'Opportunity', 'Type', 'Financial Tier', 'Property Tier', 'Family Tier', 'Base Annual Price', 'Journey', 'Health',
    'Current ARR', 'Target ARR', 'Renewal / Close',
    'Forecast', 'MEDDPICC Score', 'MEDDPICC %', 'Weak Blockers',
    'Why Change', 'Why Now', 'Why Eleven', 'Solution / Value',
    'Incumbents', 'Competitive Strategy',
    'Champion', 'Economic Buyer', 'Stakeholder Count',
    '#1 Ask', 'Next Touch', 'Last Engagement',
    'Obj 1', 'Obj 1 Date', 'Obj 2', 'Obj 2 Date', 'Obj 3', 'Obj 3 Date',
    'Context / Notes'
  ]);

  opps.forEach(a => {
    const s  = a.data.snapshot;
    const p  = a.data.accountpov;
    const o  = a.data.opppov;
    const m  = a.data.map;
    const ma = o.meddAnswers || {};

    // Score
    let yes = 0, total = 0;
    MEDD.forEach(ms => ms.questions.forEach((_, i) => {
      total++;
      if (ma[ms.id + '_' + i] === 'yes') yes++;
    }));
    const bl = MEDD.filter(sec => sec.blocker);
    let bY = 0, bT = 0;
    bl.forEach(ms => ms.questions.forEach((_, i) => { bT++; if (ma[ms.id + '_' + i] === 'yes') bY++; }));
    const pct = yes / total, bp = bY / bT;
    let fc = 'Omit';
    if (bp >= 0.75 && pct >= 0.70) fc = 'Commit';
    else if (bp >= 0.55 && pct >= 0.50) fc = 'Upside';
    else if (pct >= 0.25 || yes >= 5) fc = 'Pipeline';

    const weakBlockers = MEDD.filter(ms => ms.blocker &&
      ms.questions.filter((_, i) => ma[ms.id + '_' + i] === 'yes').length < Math.ceil(ms.questions.length / 2)
    ).map(ms => ms.title).join('; ');

    const champion = a.data.stakeholders.find(st => st.role === 'Champion');
    const eb       = a.data.stakeholders.find(st => st.role === 'Economic buyer');

    csv += csvRow([
      a.name, s.firmType,
      (s.modules || {}).financial || '', (s.modules || {}).property || '', (s.modules || {}).family || '',
      modulesTotal(s.modules) ? '$' + modulesTotal(s.modules) : '',
      s.journey, s.healthStatus,
      s.currentArr, s.targetArr, s.renewalQ,
      fc, yes + '/' + total, Math.round(pct * 100) + '%', weakBlockers || 'None',
      p.whyChange, p.whyNow, p.whyUs, p.whatSolution,
      o.incumbents, o.competitiveStrategy,
      champion ? champion.name + ' (' + champion.sentiment + ')' : '',
      eb        ? eb.name + ' (' + eb.sentiment + ')' : '',
      a.data.stakeholders.length,
      m.topAsk, m.nextTouch, m.lastEngagement,
      p.objective1, p.obj1date, p.objective2, p.obj2date, p.objective3, p.obj3date,
      s.notes
    ]);
  });

  // ── Sheet 2: MEDDPICC detail (one row per section per opportunity) ──
  csv += '\r\n';
  csv += csvRow(['MEDDPICC DETAIL']);
  csv += csvRow(['Opportunity', 'Section', 'Blocker', 'Score', 'Q1', 'Q2', 'Q3', 'Q4', 'Notes']);

  opps.forEach(a => {
    const ma    = a.data.meddpicc.meddAnswers || {};
    const notes = a.data.meddpicc.meddNotes   || {};
    MEDD.forEach(ms => {
      const answers = ms.questions.map((_, i) => ma[ms.id + '_' + i] === 'yes' ? 'Yes' : ma[ms.id + '_' + i] === 'no' ? 'No' : '');
      const sectionYes = answers.filter(v => v === 'Yes').length;
      csv += csvRow([
        a.name, ms.title, ms.blocker ? 'Yes' : 'No',
        sectionYes + '/' + ms.questions.length,
        ...answers,
        notes[ms.id] || ''
      ]);
    });
  });

  // ── Sheet 3: Gaps (one row per gap per opportunity) ──
  csv += '\r\n';
  csv += csvRow(['OPPORTUNITY GAPS']);
  csv += csvRow(['Opportunity', 'Section', 'Type', 'Gap', 'Action to Close', 'Owner', 'By']);

  opps.forEach(a => {
    const ma = a.data.meddpicc.meddAnswers  || {};
    const ov = a.data.meddpicc.gapOverrides || {};
    MEDD.filter(ms => ms.blocker &&
      ms.questions.filter((_, i) => ma[ms.id + '_' + i] === 'yes').length < Math.ceil(ms.questions.length / 2)
    ).forEach(ms => {
      csv += csvRow([
        a.name, ms.title, 'Blocker',
        ov[ms.id + '_gap']    || '',
        ov[ms.id + '_action'] || '',
        ov[ms.id + '_owner']  || '',
        ov[ms.id + '_by']     || ''
      ]);
    });
    (ov.__manual || []).forEach(r => {
      csv += csvRow([a.name, r.section || 'Custom', 'Manual', r.gap || '', r.action || '', r.owner || '', r.by || '']);
    });
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'eleven_opportunity_plan_' + new Date().toISOString().slice(0, 10) + '.csv';
  link.click();
}

/* ================================================================
   OPPORTUNITY LOG
   Uses localStorage so the log persists across browser sessions.
   Key: 'eleven_opp_log'  Value: JSON array of log entries.
   ================================================================ */

function getLog() {
  try { return JSON.parse(localStorage.getItem('eleven_opp_log') || '[]'); }
  catch(e) { return []; }
}
function setLog(entries) {
  try { localStorage.setItem('eleven_opp_log', JSON.stringify(entries)); }
  catch(e) {}
}

function deriveStage(journey, yes, total, meddAnswers) {
  // Stage is derived: explicit journey field if set, otherwise inferred from qualification depth
  if (journey) return journey;
  const pct = total ? yes / total : 0;
  if (pct >= 0.65) return 'Expand';
  if (pct >= 0.35) return 'Land';
  return 'Land';
}

function buildLogEntry(a) {
  const s  = a.data.snapshot;
  const m  = a.data.map;
  const ma = (a.data.meddpicc && a.data.meddpicc.meddAnswers) || {};
  let yes = 0, total = 0;
  MEDD.forEach(ms => ms.questions.forEach((_, i) => {
    total++;
    if (ma[ms.id + '_' + i] === 'yes') yes++;
  }));
  const bl = MEDD.filter(sec => sec.blocker);
  let bY = 0, bT = 0;
  bl.forEach(ms => ms.questions.forEach((_, i) => { bT++; if (ma[ms.id + '_' + i] === 'yes') bY++; }));
  const p = yes / total, bp = bT ? bY / bT : 0;
  let fc = 'Omit';
  if (bp >= 0.75 && p >= 0.70) fc = 'Commit';
  else if (bp >= 0.55 && p >= 0.50) fc = 'Upside';
  else if (p >= 0.25 || yes >= 5) fc = 'Pipeline';
  const stage = deriveStage(s.journey, yes, total, ma);
  return {
    id:          a.id || (a.id = Date.now() + '_' + Math.random().toString(36).slice(2)),
    name:        a.name,
    firmType:    s.firmType    || '',
    aum:         modulesTotal(s.modules) ? '$' + (modulesTotal(s.modules) / 1000) + 'K' : '',
    arr:         modulesTotal(s.modules),
    modules:     Object.assign({}, s.modules),
    currentArr:  s.currentArr  || '',
    targetArr:   s.targetArr   || '',
    healthStatus:s.healthStatus|| '',
    journey:     stage,
    renewalQ:    s.renewalQ    || '',
    meddScore:   yes,
    meddTotal:   total,
    healthScore: calcHealthScore(a.data),
    forecast:    fc,
    nextTouch:   m.nextTouch   || '',
    topAsk:      m.topAsk      || '',
    savedAt:     new Date().toISOString()
  };
}

function saveToLog() {
  // Ensure the current opp has a stable id
  if (!opps[currentOpp].id) opps[currentOpp].id = Date.now() + '_' + Math.random().toString(36).slice(2);
  const entry = buildLogEntry(opps[currentOpp]);
  const log = getLog();
  const idx = log.findIndex(e => e.id === entry.id);
  if (idx >= 0) log[idx] = entry;  // update existing
  else log.unshift(entry);          // prepend new
  setLog(log);
  updateLogCount();
  // Flash save indicator
  const ind = document.getElementById('saveIndicator');
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 2000);
}

function updateLogCount() {
  // Count badge now lives in the sidebar nav pill — re-render sidebar
  renderSidebar();
}

/* ════════════════════════════════════════════════════════════════
   THEMES VIEW — cross-opportunity synthesis over live `opps` memory
   Reads the same in-session data as every other view. No external
   source. Deterministic first-pass synthesis; structured so the rule
   layer can later be swapped for an LLM pass returning the same shape.
   ════════════════════════════════════════════════════════════════ */

// Build a normalized signal record per opp from live memory
function themesBuildRecords() {
  return opps.filter(o => !o.archived).map((o, idx) => {
    const data = o.data || {};
    const calls = data.calls || [];
    let findings = [];
    calls.forEach(c => { if (Array.isArray(c.findings)) findings = findings.concat(c.findings); });
    const fText = (findings.map(f => `${f.title || ''} ${f.evidence || ''}`).join(' ')
      + ' ' + calls.map(c => c.transcript || '').join(' ')
      + ' ' + calls.map(c => c.summary || '').join(' ')).toLowerCase();
    const snapNotes = (data.snapshot && data.snapshot.notes || '').toLowerCase();
    const medd = (data.meddpicc && data.meddpicc.meddAnswers) || {};
    const meddYes = Object.values(medd).filter(v => v === 'yes').length;
    const stk = data.stakeholders || [];
    const redFlags = findings.filter(f => f.type === 'red_flag');
    const gaps = findings.filter(f => f.type === 'gap');
    const has = (...kw) => kw.some(k => fText.includes(k) || snapNotes.includes(k));
    const ebGapNamed = gaps.some(g => /economic buyer|eb |no economic|path to eb/i.test((g.title || '') + (g.evidence || '')));
    return {
      idx, id: o.id, name: o.name, data,
      firmType: (data.snapshot && data.snapshot.firmType) || '',
      arr: modulesTotal(data.snapshot && data.snapshot.modules),
      forecast: calcForecastForData(data),
      meddYes, stkCount: stk.length, callCount: calls.length,
      findings, redFlags, gaps, fText,
      sig: {
        infosec: has('infosec', 'cyber', 'security team', 'security review', 'security call'),
        whitelabel: has('white label', 'white-label', 'white labeled', 'white-labeled', 'offer to their clients', 'solution that they offer', 'family office solution that they', 'roll out the platform', 'rolling out the platform', 'offer to their customers', 'rolling it out to their'),
        buildVsBuy: has('in-house', 'in house', 'internal ai', 'building internal', 'build vs', 'developing internal', 'building in-house'),
        noUrgency: has('no urgency', 'no compelling', 'discuss internally', 'non-committal', 'no clear need'),
        ebGap: ebGapNamed,
        ebEngaged: stk.some(s => /economic/i.test(s.role || '') && /advocate|positive|support/i.test(s.sentiment || s.disposition || ''))
          || findings.some(f => /eb has been named and attended|attended (a )?full demo|decision maker.*attended/i.test((f.title || '') + ' ' + (f.evidence || ''))),
        ebIdentified: stk.some(s => /economic/i.test(s.role || '')) || has('economic buyer', 'decision maker'),
        scaleConcern: has('how we would scale', 'scale if they', 'scale concern'),
        forcingEvent: has('discrepancy', 'embarrass', 'in front of the principal', 'in front of the whole', 'flagged'),
      }
    };
  });
}

// Synthesize themes across records. Each theme: id, title, severity,
// meddElement, evidence, dealIdxs[], and a per-lens action map.
function themesSynthesize(recs) {
  const byIdx = i => recs.find(r => r.idx === i);
  const names = idxs => idxs.map(i => byIdx(i) ? byIdx(i).name : '').filter(Boolean);
  const themes = [];

  // 1. White-label channel motion
  const wl = recs.filter(r => r.sig.whitelabel);
  if (wl.length >= 2) {
    themes.push({
      id: 'channel_play', severity: 'high', meddElement: 'Strategy / Motion',
      title: 'White-label channel motion emerging — Eleven as the platform institutions offer their own clients',
      evidence: `The same vision recurs independently across ${names(wl.map(r=>r.idx)).join(', ')}: Eleven as a white-labeled family-office solution the institution resells to its clients, bundling services they don't natively provide. Where an EB has engaged (JP Morgan), the white-label vision landed directly.`,
      dealIdxs: wl.map(r => r.idx),
      lenses: {
        revenue: 'A different sale than direct-to-family-office — partner-led and longer, but each is a channel of many clients, not one logo. Track on a separate channel pipeline with its own stage model so it doesn\'t dilute direct forecasting. JP Morgan is the lead horse: EB engaged, only scale concern outstanding.',
        product: 'The single biggest signal in the book: tier-1 institutions want to resell Eleven, including services Eleven doesn\'t offer natively. That implies a partner/white-label surface, multi-tenant isolation, and service-bundling on the roadmap. The market may be pulling toward B2B2C, not just direct.',
        funnel: 'These are partner channels, not single accounts — qualify the partner\'s willingness to introduce their client base, not just their own buying intent. Different playbook from direct family-office outreach.',
        board: 'A white-label motion through institutions like JPM, Goldman and Jefferies is a materially larger TAM story than direct family-office sales, and JPM already has an engaged economic buyer. Worth framing as a second, higher-leverage GTM thesis.'
      }
    });
  }

  // 2. InfoSec / security gate
  const sec = recs.filter(r => r.sig.infosec);
  if (sec.length >= 2) {
    const stalled = sec.filter(r => r.redFlags.some(f => /infosec|audit|security/i.test(f.title || '')));
    themes.push({
      id: 'infosec_gate', severity: 'high', meddElement: 'Paper Process',
      title: 'Security / InfoSec review is the recurring gate on every institutional deal',
      evidence: `Security review is the named next step or active blocker at ${names(sec.map(r=>r.idx)).join(', ')}.${stalled.length ? ` On ${names(stalled.map(r=>r.idx)).join(', ')} an unfinished audit is actively stalling progress and gating the champion's next move.` : ''}`,
      dealIdxs: sec.map(r => r.idx),
      lenses: {
        revenue: 'InfoSec is a predictable, repeatable gate — get ahead of it. A standing security packet (SOC2 / data-handling brief) plus a named timeline turns a multi-week stall into a checkbox. Finishing the Jefferies audit unblocks the champion\'s advisor intros.',
        product: 'Security / data-sovereignty review is the universal precondition to institutional adoption. The private-data-store story is the right wedge — but it must be demonstrably real and packaged for a security team, not just positioned in a pitch. This is the trust question made operational.',
        funnel: 'Security review is a stage gate to bake into the channel/institutional playbook. Surface it early so it doesn\'t surprise the deal late.',
        board: 'Every institutional deal routes through security review. A repeatable security-clearance motion is a leading indicator of institutional readiness — the core PMF question for this market.'
      }
    });
  }

  // 3. Economic buyer access
  const ebWeak = recs.filter(r => (r.stkCount > 0 || r.callCount > 0) && !r.sig.ebEngaged && (r.sig.ebGap || r.sig.ebIdentified));  if (ebWeak.length >= 2) {
    themes.push({
      id: 'eb_access', severity: 'high', meddElement: 'Economic Buyer',
      title: 'Economic Buyer is structurally shielded — except where a warm intro cracked it',
      evidence: `EB is missing, unreachable, or identified-but-cold across ${names(ebWeak.map(r=>r.idx)).join(', ')}. The instructive exception: at JP Morgan a referral routed Eleven straight to the EB, who then attended a full demo. Warm institutional intros beat the ops-layer shield.`,
      dealIdxs: ebWeak.map(r => r.idx),
      lenses: {
        revenue: 'The JPM pattern is the play: a credible referral source routes straight to the EB. Lean on referral channels for buyer access rather than grinding up through ops intermediaries. On Meridian, convert the identified-but-cold principal via the principal-facing demo the champion already said would accelerate.',
        product: 'Where Eleven reaches the buyer directly, it engages — the barrier is access, not the pitch. Reinforces the case for a principal-facing surface a champion can carry upward without us in the room.',
        funnel: 'A deal without a named, reachable economic buyer is not yet real pipeline regardless of demo enthusiasm. Weight EB access heavily at qualification before it consumes demo time.',
        board: 'Buyer access is the recurring constraint, and the data shows warm institutional referrals are what crack it — a repeatable, ownable motion, and the operational form of the trust barrier this market is defined by.'
      }
    });
  }

  // 4. No compelling event / build-vs-buy inertia (direct FO)
  const inertia = recs.filter(r => r.sig.noUrgency || r.sig.buildVsBuy);
  const forcing = recs.filter(r => r.sig.forcingEvent);
  if (inertia.length >= 1 && forcing.length >= 1) {
    themes.push({
      id: 'no_compelling_event', severity: 'medium', meddElement: 'Competition / Why Now',
      title: 'Direct family-office deals stall without a compelling event — and face build-vs-buy inertia',
      evidence: `${names(forcing.map(r=>r.idx))[0] || 'The advancing deal'} moved on a real forcing event. The counter-case (${names(inertia.map(r=>r.idx)).join(', ')}): polite interest, no urgency, and at least one prospect actively building internal AI tools — a live build-vs-buy alternative.`,
      dealIdxs: Array.from(new Set([...forcing.map(r=>r.idx), ...inertia.map(r=>r.idx)])),
      lenses: {
        revenue: 'Qualify hard for a compelling event before investing demo time in direct FO deals. No forcing function plus an internal-build alternative = de-prioritize. Replicate the Meridian pattern: surface the operational incident that makes status quo untenable.',
        product: 'Build-vs-buy is a live competitor — sophisticated offices are building internal AI. The defensible edge has to be UHNW-specific operational depth they can\'t cheaply replicate, not generic AI features.',
        funnel: 'Screen for a compelling event at qualification. Without one, a direct FO opportunity is a long-shot regardless of how the demo lands.',
        board: 'The direct FO motion converts on a forcing event; absent that, inertia and internal-build win. Part of why the channel/white-label motion may be the higher-leverage thesis.'
      }
    });
  }

  // 5. Coverage / count-vs-signal
  const worked = recs.filter(r => r.callCount > 0 || r.meddYes > 0);
  const untouched = recs.filter(r => r.callCount === 0 && r.meddYes === 0);
  if (untouched.length >= 2) {
    themes.push({
      id: 'thin_book', severity: 'medium', meddElement: 'Coverage',
      title: 'Headline pipeline overstates worked deals — count vs. signal',
      evidence: `Of ${recs.length} active logos, ${worked.length} have logged calls or qualification data; ${untouched.length} are untouched (${names(untouched.map(r=>r.idx)).slice(0,6).join(', ')}). Referral sources are mixed into the deal count.`,
      dealIdxs: untouched.map(r => r.idx),
      lenses: {
        revenue: 'Reclassify the book: direct vs. channel vs. referral source. Referral engines aren\'t pipeline. Force a first qualification call on the untouched logos before they earn demo time.',
        product: 'Low roadmap signal from the untouched tier — the priority is protecting demo time: nothing here earns a demo until qualified.',
        funnel: 'This is the funnel-health view: untouched logos are a follow-up/sequencing gap, not dead pipeline. Next-best-action is first-call scheduling.',
        board: `Active, worked pipeline is ~${worked.length} deals, not ${recs.length}. Forecast on the qualified subset; treat the rest as top-of-funnel coverage.`
      }
    });
  }

  return themes;
}

// Single AE-framed Themes view. The synthesis still produces all
// framings per theme (see t.lenses), kept for a future "export for
// product/leadership" path — but the UI shows only the AE cut.
const THEME_AE_ORDER = ['channel_play','eb_access','infosec_gate','no_compelling_event','thin_book'];

function buildThemesPage() {
  const recs = themesBuildRecords();
  let themes = themesSynthesize(recs);
  themes = themes.slice().sort((a, b) => {
    const ai = THEME_AE_ORDER.indexOf(a.id), bi = THEME_AE_ORDER.indexOf(b.id);
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
  });

  const totalCalls = recs.reduce((s, r) => s + r.callCount, 0);
  const worked = recs.filter(r => r.callCount > 0 || r.meddYes > 0).length;
  const highCount = themes.filter(t => t.severity === 'high').length;

  const summaryHTML = `
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px">
  <div class="medd-score-card"><div class="lbl">Active deals</div><div class="val">${recs.length}</div></div>

  <div class="medd-score-card"><div class="lbl">High severity</div><div class="val" style="color:var(--text-danger)">${highCount}</div></div>
</div>`;

  const sevClass = s => s === 'high' ? 'fc-omit' : s === 'medium' ? 'fc-pipeline' : 'fc-commit';

  const cards = themes.map(t => {
    const chips = t.dealIdxs.map(i => {
      const r = recs.find(x => x.idx === i);

      const fc = { Commit: 'fc-commit', Upside: 'fc-upside', Pipeline: 'fc-pipeline', Omit: 'fc-omit' }[r.forecast] || 'fc-omit';
      return `<button class="theme-chip" onclick="jumpToOpp('${r.id}')" title="Open ${esc(r.name)} in the app">
        <span class="theme-chip-dot ${fc}"></span>${esc(r.name)}<span class="theme-chip-arrow">↗</span></button>`;
    }).join('');
    return `
<div class="theme-card">
  <div class="theme-card-head">
    <div>
      <div class="theme-card-meta">

  </div>

${cards}${empty}
<div class="theme-footnote">Synthesized live from ${totalCalls} logged call${totalCalls === 1 ? '' : 's'} and current qualification data across the book. Click any deal to drill in.</div>`;

function buildPipelinePage() {
  const log = getLog();
  const active   = log.filter(e => !e.archived);
  const archived = log.filter(e => e.archived);

  // ARR per log entry — prefer the live opp's current module total, fall back to stored value.
  const entryARR = e => {
    const lo = opps.find(o => o.id === e.id);
    if (lo) return oppARR(lo);
    return typeof e.arr === 'number' ? e.arr : modulesTotal(e.modules);
  };

  // Summary stats — active only
  const totalARR = active.reduce((sum, e) => sum + entryARR(e), 0);
  const commits  = active.filter(e => e.forecast === 'Commit').length;
  const upsides  = active.filter(e => e.forecast === 'Upside').length;
  const pipes    = active.filter(e => e.forecast === 'Pipeline').length;
  const omits    = active.filter(e => e.forecast === 'Omit').length;

  const summaryHTML = `
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px">
  <div class="medd-score-card"><div class="lbl">Opportunities</div><div class="val">${active.length}</div></div>
  <div class="medd-score-card"><div class="lbl">ARR</div><div class="val" style="font-size:18px">${totalARR > 0 ? fmtARR(totalARR) : '—'}</div></div>
  <div class="medd-score-card"><div class="lbl">Commit / Upside</div><div class="val"><span style="color:var(--text-success)">${commits}</span> <span style="font-size:14px;color:var(--text-tertiary)">/ ${upsides}</span></div></div>
  <div class="medd-score-card"><div class="lbl">Pipeline / Omit</div><div class="val"><span style="color:var(--text-warning)">${pipes}</span> <span style="font-size:14px;color:var(--text-tertiary)">/ ${omits}</span></div></div>
</div>`;

  const stageColors = { Land:'fc-pipeline', Adopt:'fc-upside', Expand:'fc-commit', Renew:'fc-upside' };

  const makeRow = (e, isArchived) => {
    const pct = Math.round((e.meddScore / e.meddTotal) * 100);
    const saved = new Date(e.savedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const fcClass = { Commit: 'fc-commit', Upside: 'fc-upside', Pipeline: 'fc-pipeline', Omit: 'fc-omit' }[e.forecast] || 'fc-omit';
    const stageClass = stageColors[e.journey] || 'fc-pipeline';
    // Prefer live in-memory score (always current); fall back to stored value
    const liveOpp = opps.find(o => o.id === e.id);
    const hs = liveOpp ? calcHealthScore(liveOpp.data) : (typeof e.healthScore === 'number' ? e.healthScore : null);
    const hsCircle = hs === null
      ? `<span class="hs-dot hs-empty">—</span>`
      : `<span class="hs-dot" style="background:${hs >= 70 ? 'var(--text-success)' : hs >= 40 ? 'var(--text-warning)' : 'var(--text-danger)'}">${hs}</span>`;
    const rowARR = entryARR(e);
    const liveForSub = opps.find(o => o.id === e.id);
    const modSub = liveForSub
      ? (modulesSummary(liveForSub.data.snapshot.modules).split(' — ')[0] || 'No modules')
      : (modulesSummary(e.modules).split(' — ')[0] || 'No modules');
    const action = isArchived
      ? `<button class="row-action restore" onclick="event.stopPropagation();restoreOpp('${e.id}')" title="Restore to active">Restore</button>`
      : `<button class="row-action" onclick="event.stopPropagation();archiveOpp('${e.id}')" title="Archive opportunity">Archive</button>`;
    return `<tr class="${isArchived ? 'archived-row' : ''}" onclick="${isArchived ? '' : `jumpToOpp('${e.id}')`}" style="cursor:${isArchived ? 'default' : 'pointer'}">
  <td>
    <div class="log-name">${esc(e.name)}</div>
    <div class="log-sub">${esc(e.aum || '—')}${e.firmType ? ' · ' + esc(e.firmType) : ''}</div>
  </td>
  <td>
    ${e.journey ? `<span class="forecast-badge ${stageClass}" style="font-size:11px;padding:2px 9px">${esc(e.journey)}</span>` : '—'}
  </td>
  <td>
    <div class="log-arr">${rowARR ? fmtARR(rowARR) : '—'}</div>
    <div class="log-arr-target">${modSub}</div>
  </td>
  <td>
    <div class="log-medd">${e.meddScore}/${e.meddTotal}</div>
    <div class="log-medd-bar"><div class="log-medd-fill" style="width:${pct}%"></div></div>
  </td>
  <td style="text-align:center">${hsCircle}</td>
  <td><span class="forecast-badge ${fcClass}" style="font-size:11px;padding:2px 9px">${e.forecast}</span></td>
  <td><span style="font-size:11px;color:var(--text-secondary)">${esc(e.renewalQ || '—')}</span></td>
  <td><span class="log-next">${esc(e.nextTouch || '—')}</span></td>
  <td><span class="log-updated">${saved}</span></td>
  <td>${action}</td>
</tr>`;
  };

  const fcRank = { Commit: 4, Upside: 3, Pipeline: 2, Omit: 1 };
  const stageRank = { Land: 1, Adopt: 2, Expand: 3, Renew: 4 };
  const pipeVal = (e, key) => {
    switch (key) {
      case 'opportunity': return (e.name || '').toLowerCase();
      case 'stage':       return stageRank[e.journey] || 0;
      case 'arr':         return entryARR(e);
      case 'qualify':     return e.meddTotal ? e.meddScore / e.meddTotal : 0;
      case 'health':      { const lo = opps.find(o => o.id === e.id); return lo ? calcHealthScore(lo.data) : (typeof e.healthScore === 'number' ? e.healthScore : -1); }
      case 'forecast':    return fcRank[e.forecast] || 0;
      case 'close':       return (e.renewalQ || '');
      case 'nexttouch':   return (e.nextTouch || '');
      case 'saved':       return e.savedAt || 0;
      default:            return 0;
    }
  };
  const sortRows = arr => arr.slice().sort((a, b) => {
    const va = pipeVal(a, pipeSort.key), vb = pipeVal(b, pipeSort.key);
    let cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
    return pipeSort.dir === 'asc' ? cmp : -cmp;
  });

  const activeRows  = sortRows(active).map(e => makeRow(e, false)).join('');
  const archivedRows = sortRows(archived).map(e => makeRow(e, true)).join('');

  const emptyActive = active.length === 0
    ? `<div style="text-align:center;padding:32px 0;color:var(--text-tertiary);font-size:13px">No saved opportunities yet. Open any opportunity plan and hit <strong>Save to Log</strong>.</div>`
    : '';

  const th = (key, label, w) => {
    const active = pipeSort.key === key;
    const upCol = active && pipeSort.dir === 'asc' ? 'var(--text-primary)' : 'var(--text-tertiary)';
    const dnCol = active && pipeSort.dir === 'desc' ? 'var(--text-primary)' : 'var(--text-tertiary)';
    return `<th style="width:${w}px" class="sortable-th${active?' sorted':''}">
      <span class="th-inner">
        <span class="th-label" onclick="setPipeSort('${key}','toggle')">${label}</span>
        <span class="th-arrows">
          <span class="th-arrow${active&&pipeSort.dir==='asc'?' on':''}" style="color:${upCol}" onclick="event.stopPropagation();setPipeSort('${key}','asc')">▲</span>
          <span class="th-arrow${active&&pipeSort.dir==='desc'?' on':''}" style="color:${dnCol}" onclick="event.stopPropagation();setPipeSort('${key}','desc')">▼</span>
        </span>
      </span>
    </th>`;
  };
  const tableHeaders = `<thead><tr>
    ${th('opportunity','Opportunity',170)}
    ${th('stage','Stage',80)}
    ${th('arr','ARR',100)}
    ${th('qualify','Qualify',90)}
    ${th('health','Health',64)}
    ${th('forecast','Forecast',90)}
    ${th('close','Close',80)}
    ${th('nexttouch','Next touch',120)}
    ${th('saved','Saved',70)}
    <th style="width:70px"></th>
  </tr></thead>`;

  const archivedSection = archived.length > 0 ? `
<div class="archived-section-header" onclick="toggleArchivedSection()">
  <span id="archivedChevron">▸</span>
  Archived (${archived.length})
</div>
<div id="archivedRows" style="display:none">
  <table class="log-table" style="width:100%">
    ${tableHeaders}
    <tbody>${archivedRows}</tbody>
  </table>
</div>` : '';

  return `<div class="slide-title">Pipeline</div>
${summaryHTML}
<table class="log-table" style="width:100%">
  ${tableHeaders}
  <tbody>${activeRows}</tbody>
</table>
${emptyActive}
${archivedSection}`;
}

function setPipeSort(key, dir) {
  if (dir === 'asc' || dir === 'desc') {
    pipeSort.key = key;
    pipeSort.dir = dir;
  } else if (pipeSort.key === key) {
    pipeSort.dir = pipeSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    pipeSort.key = key;
    pipeSort.dir = key === 'opportunity' ? 'asc' : 'desc';
  }
  renderCurrentSlide();
}

function archiveOpp(id) {
  const log = getLog();
  const idx = log.findIndex(e => e.id === id);
  if (idx >= 0) {
    log[idx].archived = true;
    setLog(log);
  }
  // Also mark in opps array
  const oi = opps.findIndex(o => o.id === id);
  if (oi >= 0) opps[oi].archived = true;
  renderCurrentSlide();
  updateLogCount();
}

function restoreOpp(id) {
  const log = getLog();
  const idx = log.findIndex(e => e.id === id);
  if (idx >= 0) {
    log[idx].archived = false;
    setLog(log);
  }
  const oi = opps.findIndex(o => o.id === id);
  if (oi >= 0) opps[oi].archived = false;
  renderCurrentSlide();
  updateLogCount();
}

function toggleArchivedSection() {
  const rows = document.getElementById('archivedRows');
  const chev = document.getElementById('archivedChevron');
  if (!rows) return;
  const open = rows.style.display === 'block';
  rows.style.display = open ? 'none' : 'block';
  if (chev) chev.textContent = open ? '▸' : '▾';
}

function deleteOpp() {
  if (!opp()) return;
  const name = opp().name;
  showModal({
    title: 'Delete opportunity',
    desc: `Permanently delete "${name}"? This cannot be undone.`,
    confirmLabel: 'Delete',
    danger: true,
    onConfirm: () => {
      const log = getLog();
      const id = opp().id;
      setLog(log.filter(e => e.id !== id));
      opps.splice(currentOpp, 1);
      currentOpp = Math.max(0, currentOpp - 1);
      if (opps.length === 0) showDashboard = true;
      render();
    }
  });
}

function jumpToOpp(id) {
  const idx = opps.findIndex(o => o.id === id);
  if (idx >= 0) {
    showPipeline = false;
    showDashboard = false;
    currentOpp = idx;
    opps[idx].currentSlide = 1;
    render();
  } else {
    alert('This opportunity is in the log but not open in this session. Re-open and save it to re-link.');
  }
}

      let findingsHTML = '';
      let coachingHTML = '';
      if (isOpen && c.findings && c.findings.length > 0) {
        const redFlags = c.findings.filter(f => f.type === 'red_flag');

          findingsHTML += redFlags.map(f => `<div class="red-flag-box">

        }

          const fi = c.findings.indexOf(f);
          const typeClass = { meddpicc: 'ft-meddpicc', pov: 'ft-pov', stakeholder: 'ft-stakeholder', gap: 'ft-gap', action: 'ft-action' }[f.type] || 'ft-action';
          const typeLabel = { meddpicc: 'Qualification', pov: 'POV update', stakeholder: 'Stakeholder', gap: 'Gap', action: 'Next action' }[f.type] || f.type;
          const cardClass = f.status === 'accepted' ? ' accepted' : f.status === 'rejected' ? ' rejected' : '';
          return `<div class="finding-card${cardClass}">
  <div class="finding-header">
    <span class="finding-type ${typeClass}">${typeLabel}</span>
    <div class="finding-body">
      <div class="finding-title">${esc(f.title)}</div>
      ${f.evidence ? '<div class="finding-evidence">"' + esc(f.evidence) + '"</div>' : ''}
      ${f.suggestion ? '<div class="finding-suggestion">→ ' + esc(f.suggestion) + '</div>' : ''}
    </div>
  </div>
  ${f.status ? '<div style="font-size:11px;padding:0 12px 8px;color:' + (f.status === 'accepted' ? 'var(--text-success)' : 'var(--text-tertiary)') + '">✓ ' + (f.status === 'accepted' ? 'Accepted' : 'Dismissed') + '</div>' :
    `<div class="finding-actions">
      <button class="finding-btn" onclick="dismissFinding(${ci},${fi})">Dismiss</button>
      <button class="finding-btn accept" onclick="acceptFinding(${ci},${fi})">Accept &amp; apply</button>
    </div>`}
</div>`;
        }).join('') + '</div>';
      }

      // Coaching steps
      if (isOpen && c.coaching && c.coaching.length > 0) {
        coachingHTML = `<div class="coaching-section">
  <div class="coaching-header">Coaching — before your next call</div>
  ${c.coaching.map(cs => `<div class="coaching-step">
    <div class="coaching-priority ${cs.priority || 'medium'}"></div>
    <div class="coaching-body">
      <div class="coaching-action">${esc(cs.action)}</div>
      ${cs.rationale ? `<div class="coaching-rationale">${esc(cs.rationale)}</div>` : ''}
      ${cs.section ? '<span class="coaching-tag">' + esc(({'snapshot':'Snapshot','stakeholders':'Stakeholders','accountpov':'Opportunity','opppov':'Opportunity','meddpicc':'Qualification','map':'Mutual Action Plan','calls':'Calls & Coaching','pov':'POV','stakeholder':'Stakeholders'}[cs.section] || cs.section)) + '</span>' : ''}
    </div>
  </div>`).join('')}

      return `<div class="call-entry">
  <div class="call-entry-header" onclick="toggleCall(${ci})">

    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="call-toggle" onclick="event.stopPropagation();toggleCall(${ci})">${isOpen ? 'collapse' : 'expand'}</button>
      <button class="call-remove" onclick="event.stopPropagation();removeCall(${ci})">remove</button>
      <svg style="width:14px;height:14px;stroke:var(--text-tertiary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s;${isOpen ? 'transform:rotate(180deg)' : ''}" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>
  ${isOpen ? `<div class="call-entry-body">
    ${c.summary ? `<div class="call-summary-pill">📋 ${esc(c.summary)}</div>` : ''}

  }

  return `${oppNameBadge()}<div class="slide-title">Comms Analysis</div>
${callsHTML}
<div class="call-form">

    <div>
      <div class="field-label">Date</div>

    </div>

  <div class="field-full">

    <textarea class="field-input" id="callTranscript" rows="8" placeholder="Paste a transcript, notes, or an email thread here…&#10;&#10;Speaker labels help but aren't required. The more context, the better the analysis."></textarea>

    <button class="analyse-btn" id="analyseBtn" onclick="analyseCall()">
      <span id="analyseBtnText">Analyse against plan</span>
    </button>
    <span style="font-size:11px;color:var(--text-tertiary)">Claude will map findings to your Qualification, POV, stakeholders, and gaps. You review before anything is applied.</span>
  </div>

</div>`;
}

function toggleCall(ci) {
  const calls = d().calls || [];
  if (calls[ci]) { calls[ci].open = calls[ci].open === false ? true : false; }
  renderCurrentSlide();
}
function setAllCalls(open) {
  (d().calls || []).forEach(c => { c.open = open; });
  renderCurrentSlide();
}
function toggleCallSource(ci) {
  const calls = d().calls || [];
  if (calls[ci]) { calls[ci].showSrc = !calls[ci].showSrc; }
  renderCurrentSlide();
}

function removeCall(ci) {
  showModal({
    title: 'Remove call log',
    desc: 'Remove this call and its findings?',
    confirmLabel: 'Remove',
    danger: true,
    onConfirm: () => { d().calls.splice(ci, 1); renderCurrentSlide(); }
  });
}

async function analyseCall() {
  const transcript = document.getElementById('callTranscript').value.trim();
  if (!transcript) { showAnalyseError('Please paste a transcript first.'); return; }

  // Duplicate guard — normalize whitespace/case and compare against logged calls
  const normT = transcript.replace(/\s+/g, ' ').toLowerCase();
  const dupe = (d().calls || []).some(c => (c.transcript || '').replace(/\s+/g, ' ').toLowerCase() === normT);
  if (dupe) {
    showModal({
      title: 'Already analysed',
      desc: 'This transcript matches one you\u2019ve already analysed on this deal. Analyse it again anyway?',
      confirmLabel: 'Analyse again',
      onConfirm: () => runCallAnalysis(transcript)
    });
    return;
  }
  runCallAnalysis(transcript);
}

COMPETITIVE STRATEGY: ${o.competitiveStrategy || 'not set'}

Rules:
- Only surface findings that are NEW or CONTRADICTORY to the current plan state. Do not repeat what is already confirmed.
- For type "meddpicc": apply.field = "meddpicc.[section_id].[question_index]", apply.value = "yes" or "no"
- For type "pov": apply.field = "pov.[whyChange|whyNow|whyUs|whatSolution]", apply.value = updated text
- For type "stakeholder": apply.field = "stakeholder.new" or "stakeholder.[name].sentiment", apply.value = the value
- For type "gap": apply.field = "gap.[medd_section_id]", apply.value = gap description
- For type "action": apply.field = "map.nextTouch", apply.value = suggested next action
- For type "red_flag": no apply needed — these are warnings only. Use for signs champion is stalling, EB is blocked, competitor is advancing, or trust has eroded.
- Be conservative. Prefer fewer high-confidence findings over many speculative ones.
- Maximum 10 findings total.

Also return a "coaching" array of 3-5 next steps the rep should take before the next call, based on the gaps identified. Each step should be specific, actionable, and directly tied to a weakness in the current plan.

Return this exact structure — all three keys required:
{
  "summary": "one sentence, max 20 words, what happened and what moved (or didn't)",
  "findings": [ ... ],
  "coaching": [
    {
      "priority": "high" | "medium",
      "action": "specific action (max 15 words)",
      "rationale": "why this matters for the deal (max 20 words)",
      "section": "meddpicc | stakeholder | pov | map"
    }
  ]
}`;

  try {
    const response = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 4000,
        temperature: 0,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const raw = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    const findings = (parsed.findings || []).map(f => ({ ...f, status: null }));

    if (!d().calls) d().calls = [];
    d().calls.unshift({
      date: date || new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
      participants,
      transcript,
      summary: parsed.summary || '',
      findings,
      coaching: parsed.coaching || [],
      open: true
    });

    setAnalysing(false);
    renderCurrentSlide();

  } catch (err) {
    setAnalysing(false);
    showAnalyseError('Analysis failed: ' + err.message + '. Check your connection and try again.');
  }
}

function setAnalysing(on) {
  const btn  = document.getElementById('analyseBtn');
  const txt  = document.getElementById('analyseBtnText');
  if (!btn) return;
  btn.disabled = on;
  btn.innerHTML = on
    ? '<span class="analyse-spinner"></span><span>Analysing…</span>'
    : '<span id="analyseBtnText">Analyse against plan</span>';
}

function showAnalyseError(msg) {
  const el = document.getElementById('analyseError');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function acceptFinding(ci, fi) {
  const f = d().calls[ci].findings[fi];
  f.status = 'accepted';
  // Apply the finding to the plan
  if (f.apply && f.apply.field) {
    const { field, value } = f.apply;
    if (field.startsWith('meddpicc.')) {
      const parts = field.split('.');
      const key = parts[1] + '_' + parts[2];
      d().meddpicc.meddAnswers[key] = value;
    } else if (field.startsWith('pov.')) {
      const key = field.split('.')[1];
      if (d().accountpov[key] !== undefined) d().accountpov[key] = value;
    } else if (field === 'map.nextTouch') {
      d().map.nextTouch = value;
    } else if (field === 'stakeholder.new') {
      const nm = (value || '').trim();
      const existing = d().stakeholders.find(st => (st.name || '').trim().toLowerCase() === nm.toLowerCase());
      if (nm && !existing) {
        d().stakeholders.push({ role: 'Neutral', name: nm, title: '', sentiment: 'Neutral', win: '' });
      }
      // If the stakeholder already exists, skip — no duplicate added
    } else if (field.startsWith('stakeholder.') && field.endsWith('.sentiment')) {
      const nm = field.slice('stakeholder.'.length, -('.sentiment'.length)).trim();
      const st = d().stakeholders.find(s => (s.name || '').trim().toLowerCase() === nm.toLowerCase());
      if (st) st.sentiment = value;
      else d().stakeholders.push({ role: 'Neutral', name: nm, title: '', sentiment: value || 'Neutral', win: '' });
    } else if (field.startsWith('gap.')) {
      const sid = field.split('.')[1];
      if (!d().meddpicc.gapOverrides) d().meddpicc.gapOverrides = { __manual: [] };
      d().meddpicc.gapOverrides[sid + '_gap'] = value;
    }
  }
  renderCurrentSlide();
  renderHeaderScore();
}

function dismissFinding(ci, fi) {
  d().calls[ci].findings[fi].status = 'rejected';
  renderCurrentSlide();
}

/* ================================================================
   TALK ENGINE — MediaRecorder → Whisper → Claude extraction
   Works on all browsers including Safari iOS/desktop.
   OpenAI key stored in localStorage under 'playbk_openai_key'.
   Anthropic key stored in localStorage under 'playbk_claude_key'.
   ================================================================ */

let _mediaRecorder = null;
let _audioChunks   = [];
let _talkField     = null;
let _talkBtn       = null;
let _talkActive    = false;
let _talkStream    = null;

// Field context — tells Claude what each field is about
const TALK_CONTEXT = {
  'snapshot.notes':          'Account situation brief — 2-3 sentences on situation, key risk, and top opportunity',
  'snapshot.stakeholderGaps':'Stakeholder gaps — who is missing from the map, who have we not met yet',
  'accountpov.whyChange':    'Why Change — what is the cost of doing nothing for this account',
  'accountpov.whyNow':       'Why Now — what is the trigger event, renewal window, or exec pressure creating urgency',
  'accountpov.whyUs':        'Why Us — what is our unique angle for this specific account',
  'accountpov.whatSolution': 'What Solution — which modules, what is the quantified ROI or value',
  'opppov.businessProblem':  'Business Problem — what operational or financial pain does this solve (not technical features)',
  'opppov.successMetric':    'Success Metric — how will success be measured, what is the quantified outcome',
  'opppov.alternative':      'The Alternative — what is the status quo, what would they do if we lost, what is good enough',
  'opppov.whitespace':       'Whitespace — what is the expansion opportunity, which modules or entities',
  'opppov.incumbents':       'Competition — what are they currently using, who are we really competing against',
  'opppov.competitive':      'Competitive strategy — how do we win, what is our differentiated angle',
  'map.topAsk':              'Top ask — what is the single most important thing needed to advance this deal',
};

function talkContext(fieldPath) {
  return TALK_CONTEXT[fieldPath] || 'Sales opportunity field — extract relevant information';
}

function getOpenAIKey() {
  // Keys handled server-side — check localStorage as fallback for local use
  let key = localStorage.getItem('playbk_openai_key') || 'proxy';
  if (!key) {
    showModal({
      title: 'OpenAI API key needed',
      desc: 'Voice input uses Whisper for transcription. Enter your OpenAI API key — stored locally, never sent anywhere except OpenAI.',
      input: true,
      placeholder: 'sk-...',
      confirmLabel: 'Save & continue',
      onConfirm: (k) => {
        if (k && k.startsWith('sk-')) {
          localStorage.setItem('playbk_openai_key', k.trim());
        }
      }
    });
    return null;
  }
  return key;
}

function getClaudeKey() {
  // Keys are handled server-side via Vercel env vars — always return truthy
  return 'proxy';
}

async function startTalk(e, fieldPath) {
  e.preventDefault();
  e.stopPropagation();

  const btn = e.currentTarget;

  // If already recording this field — stop and process
  if (_talkActive && _talkField === fieldPath) {
    stopRecording();
    return;
  }

  // Stop any existing session
  if (_talkActive) stopTalk();

  // Check for OpenAI key
  const key = getOpenAIKey();
  if (!key) return;

  // Request mic access
  try {
    _talkStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(err) {
    showTalkStatus(fieldPath, 'Mic access denied — check browser permissions');
    return;
  }

  _talkField  = fieldPath;
  _talkBtn    = btn;
  _talkActive = true;
  _audioChunks = [];

  btn.classList.add('recording');
  showTalkStatus(fieldPath, '🔴 Recording… tap mic to stop');

  // Pick best supported format for Safari/Chrome
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/webm')
      ? 'audio/webm'
      : 'audio/mp4';

  _mediaRecorder = new MediaRecorder(_talkStream, { mimeType });

  _mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) _audioChunks.push(e.data);
  };

  _mediaRecorder.onstop = async () => {
    const ext  = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(_audioChunks, { type: mimeType });
    _talkStream.getTracks().forEach(t => t.stop());
    _talkStream = null;
    if (blob.size > 1000) {
      await transcribeAndProcess(fieldPath, blob, ext);
    } else {
      showTalkStatus(fieldPath, 'Nothing recorded — try again');
      stopTalk();
    }
  };

  _mediaRecorder.start(100); // collect in 100ms chunks
}

function stopRecording() {
  if (_mediaRecorder && _mediaRecorder.state !== 'inactive') {
    _mediaRecorder.stop();
  }
  if (_talkBtn) _talkBtn.classList.remove('recording');
}

function stopTalk() {
  _talkActive = false;
  if (_mediaRecorder && _mediaRecorder.state !== 'inactive') {
    try { _mediaRecorder.stop(); } catch(e) {}
  }
  _mediaRecorder = null;
  if (_talkStream) { _talkStream.getTracks().forEach(t => t.stop()); _talkStream = null; }
  if (_talkBtn) { _talkBtn.classList.remove('recording', 'processing'); _talkBtn = null; }
}

async function transcribeAndProcess(fieldPath, blob, ext) {
  if (_talkBtn) _talkBtn.classList.add('processing');
  showTalkStatus(fieldPath, '⏳ Transcribing…');

  const key = localStorage.getItem('playbk_openai_key') || 'proxy';

  try {
    // Step 1 — Whisper transcription
    const formData = new FormData();
    formData.append('file', blob, 'audio.' + ext);
    formData.append('model', 'whisper-1');
    formData.append('language', 'en');

    const whisperResp = await fetch('/api/whisper', {
      method: 'POST',
      body: formData
    });

    if (!whisperResp.ok) {
      const err = await whisperResp.json();
      throw new Error(err.error?.message || 'Whisper error');
    }

    const whisperData = await whisperResp.json();
    const transcript  = (whisperData.text || '').trim();

    if (!transcript) {
      showTalkStatus(fieldPath, 'Nothing heard — try again');
      stopTalk();
      return;
    }

    // Step 2 — Claude extraction
    showTalkStatus(fieldPath, '⏳ Extracting…');
    await processTalk(fieldPath, transcript);

  } catch(err) {
    showTalkStatus(fieldPath, '⚠ ' + err.message);
    stopTalk();
  }
}

async function processTalk(fieldPath, transcript) {
  const oppName  = opp() ? opp().name : 'unknown';
  const firmType = d().snapshot.firmType || 'unknown';
  const context  = talkContext(fieldPath);

  const prompt = `You are an expert B2B sales coach helping an AE document their opportunity in real time.

The AE just said this about their deal:
"${transcript}"

Field context: ${context}
Opportunity: ${oppName} | Firm type: ${firmType}

Your job:
1. Extract a clean, concise value for this field from what was said (1-3 sentences max, factual, no fluff)
2. Identify the single most important follow-up question based on what was said AND what seems missing

Return ONLY valid JSON:
{
  "extracted": "the clean extracted value for the field",
  "question": "one specific follow-up question the AE should answer next (max 15 words, conversational)"
}

If nothing relevant was said for this field, return { "extracted": "", "question": "" }`;

  try {
    const resp = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 400,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);

    const raw    = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());

    if (parsed.extracted) {
      setDeep(fieldPath, parsed.extracted);
      const ta = document.querySelector(`[data-f="${fieldPath}"]`);
      if (ta) ta.value = parsed.extracted;
      showTalkStatus(fieldPath, '');
      if (parsed.question) {
        const safeId  = fieldPath.replace(/\./g, '_');
        const statusEl = document.getElementById('ts_' + safeId);
        if (statusEl) {
          statusEl.innerHTML = `<div class="talk-coaching"><div><strong>Follow-up</strong>${parsed.question}</div></div>`;
        }
      }
    } else {
      showTalkStatus(fieldPath, 'Nothing clear extracted — try again with more detail');
    }
  } catch(err) {
    showTalkStatus(fieldPath, '⚠ ' + err.message);
  } finally {
    stopTalk();
  }
}

function showTalkStatus(fieldPath, msg) {
  const safeId = fieldPath.replace(/\./g, '_');
  const el = document.getElementById('ts_' + safeId);
  if (!el) return;
  if (msg && !msg.startsWith('<')) {
    el.textContent = msg;
  } else if (!msg) {
    if (!el.querySelector('.talk-coaching')) el.textContent = '';
  }
}

function loadState() {

    const saved = JSON.parse(raw);
    if (saved.opps && saved.opps.length) {
      opps = saved.opps.map(o => ({
        ...o,
        openMedd: new Set(o.openMedd || ['metrics']),
        // Ensure freshData fills any fields added since last save
        data: { ...freshData(), ...o.data,
          meddpicc: { meddAnswers:{}, meddNotes:{}, gapOverrides:{__manual:[]}, ...(o.data.meddpicc||{}) },

          calls: o.data.calls || []
        }

      currentOpp = Math.min(saved.currentOpp || 0, opps.length - 1);
      showDashboard = saved.showDashboard !== false;

  updateLogCount();
}

// ── Backup / Restore ──────────────────────────────────────────
// Manual JSON export/import of full app state. Offline safety net
// and portability path; survives into the Supabase migration.
function backupToFile() {
  try {
    const payload = {
      _format: 'playbk-backup',
      _version: 1,
      exportedAt: new Date().toISOString(),
      state: JSON.parse(localStorage.getItem(STATE_KEY) || 'null'),
      log:   JSON.parse(localStorage.getItem('eleven_opp_log') || '[]'),
      collapsedBranches: JSON.parse(localStorage.getItem('playbk_collapsed_branches') || '[]')
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    a.href = url;
    a.download = 'playbk_backup_' + stamp + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) {
    showModal({ title: 'Backup failed', desc: e.message, confirmLabel: 'OK', onConfirm: () => {} });
  }
}

function restoreFromFile(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = ''; // reset so the same file can be re-selected later
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); }
    catch { showModal({ title: 'Restore failed', desc: 'That file is not valid JSON.', confirmLabel: 'OK', onConfirm: () => {} }); return; }

    // Accept either our wrapped backup format, or a bare state object as a fallback
    const isWrapped = parsed && parsed._format === 'playbk-backup';
    const hasBareState = parsed && parsed.opps && Array.isArray(parsed.opps);
    if (!isWrapped && !hasBareState) {
      showModal({ title: 'Restore failed', desc: 'This does not look like a Playbk backup file.', confirmLabel: 'OK', onConfirm: () => {} });
      return;
    }

    const oppCount = isWrapped ? (parsed.state?.opps?.length || 0) : (parsed.opps?.length || 0);
    showModal({
      title: 'Restore from backup?',
      desc: `This will replace all current deals and pipeline with the backup (${oppCount} deal${oppCount === 1 ? '' : 's'}). This cannot be undone.`,
      confirmLabel: 'Replace & restore',
      onConfirm: () => {
        try {
          if (isWrapped) {
            if (parsed.state) localStorage.setItem(STATE_KEY, JSON.stringify(parsed.state));
            localStorage.setItem('eleven_opp_log', JSON.stringify(parsed.log || []));
            localStorage.setItem('playbk_collapsed_branches', JSON.stringify(parsed.collapsedBranches || []));
          } else {
            localStorage.setItem(STATE_KEY, JSON.stringify(parsed));
          }
          // Rehydrate in-memory state from the freshly written keys
          _collapsedBranches = (() => { try { return new Set(JSON.parse(localStorage.getItem('playbk_collapsed_branches') || '[]')); } catch { return new Set(); } })();
          loadState();
          updateLogCount();
        } catch(e) {
          showModal({ title: 'Restore failed', desc: e.message, confirmLabel: 'OK', onConfirm: () => {} });
        }
      }
    });
  };
  reader.onerror = () => showModal({ title: 'Restore failed', desc: 'Could not read the file.', confirmLabel: 'OK', onConfirm: () => {} });
  reader.readAsText(file);
}

/* ── Deal Conviction ─────────────────────────────── */
function getConviction() {
  if (!d().conviction) d().conviction = { deal: null, win: null, play: null, note: '' };
  return d().conviction;
}

function setConviction(key, val) {
  getConviction(); // ensures d().conviction is initialised before setDeep
  const current = d().conviction[key];
  if (current === val) {
    // deselect
    setDeep('conviction.' + key, null);
  } else {
    setDeep('conviction.' + key, val);
    if (val === 'no') showConvictionModal(key);
  }
  render();
}

function convictionStatus() {
  const c = getConviction();
  const answers = [c.deal, c.win, c.play];
  if (answers.every(a => a === 'yes'))   return 'green';
  if (answers.some(a => a === 'no'))     return 'red';
  if (answers.some(a => a !== null))     return 'amber';
  return 'none';
}

function convictionLabel() {
  const st = convictionStatus();
  if (st === 'green') return 'Convicted';
  if (st === 'red')   return 'Walk Away?';
  if (st === 'amber') return 'Uncertain';
  return 'Not set';
}

function renderConvictionCard() {
  const el = document.getElementById('convictionCard');
  if (el) el.outerHTML = buildConvictionCard();
}

function renderConvictionSidebar() {
  const el = document.getElementById('sidebarConviction');
  if (el) {
    const st = convictionStatus();
    el.className = `conviction-dot ${st}`;
    const lbl = el.nextElementSibling;
    if (lbl) lbl.textContent = convictionLabel();
  }
}

function buildConvictionCard() {
  const c = getConviction();

  const questions = [
    { key: 'deal', label: 'Is there a deal?' },
    { key: 'win',  label: 'Can we win?' },
    { key: 'play', label: 'Should we play?' }
  ];
  const mic = `<button class="talk-btn" onclick="startTalk(event,'conviction.note')" title="Talk this field" tabindex="-1"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23" stroke="currentColor" stroke-width="2" fill="none"/><line x1="8" y1="23" x2="16" y2="23" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>`;
  const qRow = questions.map((q, i) => {
    const v = c[q.key];

  <button class="chip${v === 'yes' ? ' sel-green' : ''}" onclick="setConviction('${q.key}','yes')">Yes</button>
  <button class="chip${v === 'uncertain' ? ' sel-amber' : ''}" onclick="setConviction('${q.key}','uncertain')">Uncertain</button>
  <button class="chip${v === 'no' ? ' sel-red' : ''}" onclick="setConviction('${q.key}','no')">No</button>
</span>${divider}`;
  }).join('');

  return `<div class="conviction-card" id="convictionCard">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <span style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-tertiary)">Deal Conviction</span>
    <span class="conviction-badge ${st}">${badge}</span>
  </div>
  <div style="display:flex;flex-direction:row;align-items:center;flex-wrap:nowrap;margin-bottom:10px;overflow-x:auto">${qRow}</div>
  <div class="talk-wrap"><textarea class="field-input" rows="2" style="font-size:12px" data-f="conviction.note" placeholder="Conviction note — what's your gut read on this deal?" oninput="setDeep('conviction.note',this.value);saveAll()">${esc(c.note || '')}</textarea>${mic}</div>
  <div class="talk-status" id="ts_conviction_note"></div>
</div>`;
}

function showConvictionModal(key) {
  // Remove any existing modal
  const existing = document.getElementById('convictionModalOverlay');
  if (existing) existing.remove();

  const label = key === 'deal' ? 'Is there a deal?' : key === 'win' ? 'Can we win?' : 'Should we play?';
  const overlay = document.createElement('div');
  overlay.className = 'conviction-modal-overlay';
  overlay.id = 'convictionModalOverlay';
  overlay.innerHTML = `<div class="conviction-modal">
  <div class="conviction-modal-title">You answered No — "${label}"</div>
  <div class="conviction-modal-sub">What would need to be true for this to change? Talk it through or type it.</div>
  <div class="talk-wrap"><textarea class="field-input" rows="3" id="convictionModalTA" placeholder="e.g. We'd need the CFO in the room and budget confirmed before Q3…" style="font-size:13px"></textarea><button class="talk-btn" onclick="startTalkModal()" title="Talk this field" tabindex="-1"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23" stroke="currentColor" stroke-width="2" fill="none"/><line x1="8" y1="23" x2="16" y2="23" stroke="currentColor" stroke-width="2" fill="none"/></svg></button></div>
  <div class="talk-status" id="ts_conviction_modal"></div>
  <div class="conviction-modal-actions">
    <button class="conviction-modal-cancel" onclick="closeConvictionModal()">Dismiss</button>
    <button class="conviction-modal-save" onclick="saveConvictionModal()">Save note</button>
  </div>
</div>`;
  document.body.appendChild(overlay);
}

function closeConvictionModal() {
  const el = document.getElementById('convictionModalOverlay');
  if (el) el.remove();
}

function saveConvictionModal() {
  // Read from textarea directly OR from voice-transcribed _modalDraft
  const ta = document.getElementById('convictionModalTA');
  const draft = (d().conviction && d().conviction._modalDraft) || '';
  const text = (ta && ta.value.trim()) || draft;
  if (text) {
    const existing = getConviction().note || '';
    const separator = existing ? '\n' : '';
    setDeep('conviction.note', existing + separator + text);
    // Clear the temp draft
    if (d().conviction) delete d().conviction._modalDraft;
    saveAll();
  }
  closeConvictionModal();
  renderConvictionCard();
}

// Voice in modal — wire to modal textarea
function startTalkModal() {
  const btn = document.querySelector('#convictionModalOverlay .talk-btn');
  if (!btn) return;
  const fakeEvent = { preventDefault: ()=>{}, stopPropagation: ()=>{}, currentTarget: btn };
  startTalk(fakeEvent, 'conviction._modalDraft');
}


/* ── Stakeholder voice helper ─────────────────────────────────── */
async function startStkTalk(e, idx, field) {
  e.preventDefault();
  e.stopPropagation();
  const btn = e.currentTarget;
  const fakeFieldPath = 'stk_' + idx + '_' + field;

  if (_talkActive && _talkField === fakeFieldPath) { stopRecording(); return; }
  if (_talkActive) stopTalk();

  const key = getOpenAIKey();
  if (!key) return;

  try {
    _talkStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(err) {
    showStkTalkStatus(idx, field, 'Mic access denied'); return;
  }

  _talkField  = fakeFieldPath;
  _talkBtn    = btn;
  _talkActive = true;
  _audioChunks = [];

  btn.classList.add('recording');
  showStkTalkStatus(idx, field, '🔴 Recording… tap mic to stop');

  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
  _mediaRecorder = new MediaRecorder(_talkStream, { mimeType });
  _mediaRecorder.ondataavailable = e => { if (e.data.size > 0) _audioChunks.push(e.data); };
  _mediaRecorder.onstop = async () => {
    const ext  = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(_audioChunks, { type: mimeType });
    await transcribeAndProcessStk(idx, field, blob, ext);
  };
  _mediaRecorder.start();
}

async function transcribeAndProcessStk(idx, field, blob, ext) {
  if (_talkBtn) _talkBtn.classList.add('processing');
  showStkTalkStatus(idx, field, '⏳ Transcribing…');

  const key = localStorage.getItem('playbk_openai_key') || 'proxy';

  try {
    const formData = new FormData();
    formData.append('file', blob, 'audio.' + ext);
    formData.append('model', 'whisper-1');
    formData.append('language', 'en');

    const whisperResp = await fetch('/api/whisper', {
      method: 'POST', body: formData
    });
    if (!whisperResp.ok) throw new Error('Whisper error');
    const transcript = ((await whisperResp.json()).text || '').trim();
    if (!transcript) { showStkTalkStatus(idx, field, 'Nothing heard — try again'); stopTalk(); return; }

    showStkTalkStatus(idx, field, '⏳ Extracting…');

    const stk = d().stakeholders[idx] || {};
    const prompt = `You are a B2B sales coach. The AE just described what a stakeholder personally gains from this deal succeeding.
Stakeholder: ${stk.name || 'unknown'} (${stk.role || 'unknown'}, ${stk.title || 'unknown'})
AE said: "${transcript}"
Extract a clean 1-2 sentence personal win for this stakeholder.
Return ONLY JSON: { "extracted": "the personal win", "question": "one short follow-up question max 15 words" }`;

    const resp = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 300, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);
    const parsed = JSON.parse(data.content.filter(b => b.type === 'text').map(b => b.text).join('').replace(/```json|```/g,'').trim());

    if (parsed.extracted) {
      setStkField(idx, field, parsed.extracted);
      const ta = document.querySelector(`[data-stk="${idx}.${field}"]`);
      if (ta) ta.value = parsed.extracted;
      showStkTalkStatus(idx, field, '');
      if (parsed.question) {
        const el = document.getElementById('ts_stk_' + idx + '_' + field);
        if (el) el.innerHTML = `<div class="talk-coaching"><div><strong>Follow-up</strong> ${parsed.question}</div></div>`;
      }
    } else {
      showStkTalkStatus(idx, field, 'Nothing clear extracted — try again');
    }
  } catch(err) {
    showStkTalkStatus(idx, field, '⚠ ' + err.message);
  } finally {
    stopTalk();
  }
}

function showStkTalkStatus(idx, field, msg) {
  const el = document.getElementById('ts_stk_' + idx + '_' + field);
  if (!el) return;
  if (msg && !msg.startsWith('<')) el.textContent = msg;
  else if (!msg) { if (!el.querySelector('.talk-coaching')) el.textContent = ''; }
}
