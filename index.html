        }
        findingsHTML += '<div class="findings-list">' + others.map((f, fi) => {
          const typeClass = { meddpicc: 'ft-meddpicc', pov: 'ft-pov', stakeholder: 'ft-stakeholder', gap: 'ft-gap', action: 'ft-action' }[f.type] || 'ft-action';
          const typeLabel = { meddpicc: 'Qualification', pov: 'POV update', stakeholder: 'Stakeholder', gap: 'Gap', action: 'Next action' }[f.type] || f.type;
          const cardClass = f.status === 'accepted' ? ' accepted' : f.status === 'rejected' ? ' rejected' : '';
          return `<div class="finding-card${cardClass}">
  <div class="finding-header">
    <span class="finding-type ${typeClass}">${typeLabel}</span>
    <div class="finding-body">
      <div class="finding-title">${esc(f.title)}</div>
      ${f.evidence ? '<div class="finding-evidence">"' + esc(f.evidence) + '"</div>' : ''}
      ${f.suggestion ? '<div class="finding-suggestion">→ ' + esc(f.suggestion) + '</div>' : ''}
    </div>
  </div>
  ${f.status ? '<div style="font-size:11px;padding:0 12px 8px;color:' + (f.status === 'accepted' ? 'var(--text-success)' : 'var(--text-tertiary)') + '">✓ ' + (f.status === 'accepted' ? 'Accepted' : 'Dismissed') + '</div>' :
    `<div class="finding-actions">
      <button class="finding-btn" onclick="dismissFinding(${ci},${fi})">Dismiss</button>
      <button class="finding-btn accept" onclick="acceptFinding(${ci},${fi})">Accept &amp; apply</button>
    </div>`}
</div>`;
        }).join('') + '</div>';
      }

      // Coaching steps
      if (isOpen && c.coaching && c.coaching.length > 0) {
        coachingHTML = `<div class="coaching-section">
  <div class="coaching-header">Coaching — before your next call</div>
  ${c.coaching.map(cs => `<div class="coaching-step">
    <div class="coaching-priority ${cs.priority || 'medium'}"></div>
    <div class="coaching-body">
      <div class="coaching-action">${esc(cs.action)}</div>
      ${cs.rationale ? `<div class="coaching-rationale">${esc(cs.rationale)}</div>` : ''}
      ${cs.section ? '<span class="coaching-tag">' + esc(({'snapshot':'Snapshot','stakeholders':'Stakeholders','accountpov':'Opportunity','opppov':'Opportunity','meddpicc':'Qualification','map':'Mutual Action Plan','calls':'Calls & Coaching','pov':'POV','stakeholder':'Stakeholders'}[cs.section] || cs.section)) + '</span>' : ''}
    </div>
  </div>`).join('')}
</div>`;
      }
      return `<div class="call-entry">
  <div class="call-entry-header" onclick="toggleCall(${ci})">
    <div class="call-entry-meta">
      <span class="call-date">${esc(c.date || 'Undated call')}</span>
      <span class="call-participants">${esc(c.participants || '')}</span>
      ${c.findings && c.findings.length ? `<span class="call-finding-count">${accepted} applied · ${pending} pending</span>` : ''}
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="call-remove" onclick="event.stopPropagation();removeCall(${ci})">remove</button>
      <svg style="width:14px;height:14px;stroke:var(--text-tertiary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s;${isOpen ? 'transform:rotate(180deg)' : ''}" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>
  ${isOpen ? `<div class="call-entry-body">
    ${c.summary ? `<div class="call-summary-pill">📋 ${esc(c.summary)}</div>` : ''}

async function analyseCall() {
  const transcript = document.getElementById('callTranscript').value.trim();
  if (!transcript) { showAnalyseError('Please paste a transcript first.'); return; }
  const date         = document.getElementById('callDate').value.trim();
  const participants = document.getElementById('callParticipants').value.trim();

  setAnalysing(true);

  // Build plan context snapshot to send alongside the transcript
  const s   = d().snapshot;
  const p   = d().accountpov;
  const o   = d().opppov;
  const stk = d().stakeholders;
  const ma  = o.meddAnswers || {};

  const meddContext = MEDD.map(ms => {
    const answers = ms.questions.map((q, i) => {
      const a = ma[ms.id + '_' + i];
      return `    [${a === 'yes' ? 'YES' : a === 'no' ? 'NO' : 'UNANSWERED'}] ${q.text}`;
    }).join('\n');
    return `  ${ms.title}${ms.blocker ? ' (BLOCKER)' : ''}:\n${answers}`;
  }).join('\n');

  const planContext = `OPPORTUNITY: ${opp().name}
FIRM TYPE: ${s.firmType || 'unknown'}
AUM: ${s.aum || 'unknown'}

CURRENT MEDDPICC STATE:
${meddContext}

CURRENT POV:
- Why change: ${p.whyChange || 'not set'}
- Why now: ${p.whyNow || 'not set'}
- Why Eleven: ${p.whyUs || 'not set'}

CURRENT STAKEHOLDERS:
${stk.length ? stk.map(st => `- ${st.role}: ${st.name || 'unnamed'} (${st.sentiment})`).join('\n') : 'None logged'}

INCUMBENTS: ${o.incumbents || 'not set'}
COMPETITIVE STRATEGY: ${o.competitiveStrategy || 'not set'}`;

  const prompt = `You are a B2B sales analyst reviewing a call transcript against an opportunity plan for Eleven Systems, an AI platform for UHNW wealth management and family office life management.

CURRENT PLAN STATE:
${planContext}

CALL TRANSCRIPT:
${transcript}

Analyse the transcript against the plan. Return ONLY valid JSON — no preamble, no markdown, no explanation outside the JSON.

Return this exact structure:
{
  "findings": [
    {
      "type": "meddpicc" | "pov" | "stakeholder" | "gap" | "action" | "red_flag",
      "title": "short descriptive title (max 12 words)",
      "evidence": "direct quote or close paraphrase from transcript (max 30 words)",
      "suggestion": "what should change in the plan (max 20 words)",
      "apply": {
        "field": "the data field to update if accepted",
        "value": "the value to set"
      }
    }
  ]
}

Rules:
- Only surface findings that are NEW or CONTRADICTORY to the current plan state. Do not repeat what is already confirmed.
- For type "meddpicc": apply.field = "meddpicc.[section_id].[question_index]", apply.value = "yes" or "no"
- For type "pov": apply.field = "pov.[whyChange|whyNow|whyUs|whatSolution]", apply.value = updated text
- For type "stakeholder": apply.field = "stakeholder.new" or "stakeholder.[name].sentiment", apply.value = the value
- For type "gap": apply.field = "gap.[medd_section_id]", apply.value = gap description
- For type "action": apply.field = "map.nextTouch", apply.value = suggested next action
- For type "red_flag": no apply needed — these are warnings only. Use for signs champion is stalling, EB is blocked, competitor is advancing, or trust has eroded.
- Be conservative. Prefer fewer high-confidence findings over many speculative ones.
- Maximum 10 findings total.

Also return a "coaching" array of 3-5 next steps the rep should take before the next call, based on the gaps identified. Each step should be specific, actionable, and directly tied to a weakness in the current plan.

Return this exact structure — all three keys required:
{
  "summary": "one sentence, max 20 words, what happened and what moved (or didn't)",
  "findings": [ ... ],
  "coaching": [
    {
      "priority": "high" | "medium",
      "action": "specific action (max 15 words)",
      "rationale": "why this matters for the deal (max 20 words)",
      "section": "meddpicc | stakeholder | pov | map"
    }
  ]
}`;

  try {
    const response = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 4000,
        temperature: 0,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const raw = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    const findings = (parsed.findings || []).map(f => ({ ...f, status: null }));

    if (!d().calls) d().calls = [];
    d().calls.unshift({
      date: date || new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
      participants,
      transcript,
      summary: parsed.summary || '',
      findings,
      coaching: parsed.coaching || [],
      open: true
    });

    setAnalysing(false);
    renderCurrentSlide();

  } catch (err) {
    setAnalysing(false);
    showAnalyseError('Analysis failed: ' + err.message + '. Check your connection and try again.');
  }
}

function setAnalysing(on) {
  const btn  = document.getElementById('analyseBtn');
  const txt  = document.getElementById('analyseBtnText');
  if (!btn) return;
  btn.disabled = on;
  btn.innerHTML = on
    ? '<span class="analyse-spinner"></span><span>Analysing…</span>'
    : '<span id="analyseBtnText">Analyse against plan</span>';
}

function showAnalyseError(msg) {
  const el = document.getElementById('analyseError');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function acceptFinding(ci, fi) {
  const f = d().calls[ci].findings[fi];
  f.status = 'accepted';
  // Apply the finding to the plan
  if (f.apply && f.apply.field) {
    const { field, value } = f.apply;
    if (field.startsWith('meddpicc.')) {
      const parts = field.split('.');
      const key = parts[1] + '_' + parts[2];
      d().meddpicc.meddAnswers[key] = value;
    } else if (field.startsWith('pov.')) {
      const key = field.split('.')[1];
      if (d().accountpov[key] !== undefined) d().accountpov[key] = value;
    } else if (field === 'map.nextTouch') {
      d().map.nextTouch = value;
    } else if (field === 'stakeholder.new') {
      d().stakeholders.push({ role: 'Neutral', name: value, title: '', sentiment: 'Neutral', win: '' });
    } else if (field.startsWith('gap.')) {
      const sid = field.split('.')[1];
      if (!d().meddpicc.gapOverrides) d().meddpicc.gapOverrides = { __manual: [] };
      d().meddpicc.gapOverrides[sid + '_gap'] = value;
    }
  }
  renderCurrentSlide();
  renderHeaderScore();
}

function dismissFinding(ci, fi) {
  d().calls[ci].findings[fi].status = 'rejected';
  renderCurrentSlide();
}

async function callClaude(prompt, btnId, loadingText) {
  const claudeKey = getClaudeKey();
  if (!claudeKey) return null;
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = true; btn.textContent = loadingText; }
  try {
    const resp = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }] })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);
    const raw = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    return JSON.parse(raw.replace(/```json|```/g, '').trim());
  } catch(e) {
    alert('Draft failed: ' + e.message);
    return null;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '✦ Draft'; }
  }
}

async function suggestMapActions() {
  const weakSections = MEDD.filter(s => s.blocker && meddYes(s.id, s.questions.length) < Math.ceil(s.questions.length / 2));
  if (weakSections.length === 0) { alert('No weak blocker sections found — MEDDPICC looks solid.'); return; }
  const btn = document.querySelector('[onclick="suggestMapActions()"]');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  const gaps = weakSections.map(s => s.title).join(', ');
  const prompt = `You are a B2B sales coach. Suggest 3 specific MAP actions to address these MEDDPICC gaps: ${gaps}.
Opportunity: ${opp().name} | Firm type: ${d().snapshot.firmType || 'unknown'}
Return ONLY JSON: { "actions": [
  { "date": "suggested timeframe e.g. Jun 15", "ownerEleven": "suggested opportunity owner e.g. AE", "ownerAccount": "suggested account owner e.g. Champion", "action": "specific action", "status": "Open" }
]}`;
  const result = await callClaude(prompt, null, '…');
  if (result && result.actions) {
    result.actions.forEach(a => d().map.rows.push(a));
    render();
  }
  if (btn) { btn.disabled = false; btn.textContent = '✦ Suggest from gaps'; }
}

function getOpenAIKey() {
  // Keys handled server-side — check localStorage as fallback for local use
  let key = localStorage.getItem('playbk_openai_key') || 'proxy';
  if (!key) {
    showModal({
      title: 'OpenAI API key needed',
      desc: 'Voice input uses Whisper for transcription. Enter your OpenAI API key — stored locally, never sent anywhere except OpenAI.',

      placeholder: 'sk-...',
      confirmLabel: 'Save & continue',

async function startTalk(e, fieldPath) {
  e.preventDefault();
  e.stopPropagation();

  const btn = e.currentTarget;

  // If already recording this field — stop and process
  if (_talkActive && _talkField === fieldPath) {
    stopRecording();
    return;
  }

  // Stop any existing session
  if (_talkActive) stopTalk();

  // Check for OpenAI key
  const key = getOpenAIKey();
  if (!key) return;

  // Request mic access
  try {
    _talkStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(err) {
    showTalkStatus(fieldPath, 'Mic access denied — check browser permissions');
    return;
  }

  _talkField  = fieldPath;
  _talkBtn    = btn;
  _talkActive = true;
  _audioChunks = [];

  btn.classList.add('recording');
  showTalkStatus(fieldPath, '🔴 Recording… tap mic to stop');

  // Pick best supported format for Safari/Chrome
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/webm')
      ? 'audio/webm'
      : 'audio/mp4';

  _mediaRecorder = new MediaRecorder(_talkStream, { mimeType });

  _mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) _audioChunks.push(e.data);
  };

  _mediaRecorder.onstop = async () => {
    const ext  = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(_audioChunks, { type: mimeType });
    _talkStream.getTracks().forEach(t => t.stop());
    _talkStream = null;
    if (blob.size > 1000) {
      await transcribeAndProcess(fieldPath, blob, ext);
    } else {
      showTalkStatus(fieldPath, 'Nothing recorded — try again');
      stopTalk();
    }
  };

  _mediaRecorder.start(100); // collect in 100ms chunks
}

function stopRecording() {
  if (_mediaRecorder && _mediaRecorder.state !== 'inactive') {
    _mediaRecorder.stop();
  }
  if (_talkBtn) _talkBtn.classList.remove('recording');
}

function stopTalk() {
  _talkActive = false;
  if (_mediaRecorder && _mediaRecorder.state !== 'inactive') {
    try { _mediaRecorder.stop(); } catch(e) {}
  }
  _mediaRecorder = null;
  if (_talkStream) { _talkStream.getTracks().forEach(t => t.stop()); _talkStream = null; }
  if (_talkBtn) { _talkBtn.classList.remove('recording', 'processing'); _talkBtn = null; }
}

async function transcribeAndProcess(fieldPath, blob, ext) {
  if (_talkBtn) _talkBtn.classList.add('processing');
  showTalkStatus(fieldPath, '⏳ Transcribing…');

  const key = localStorage.getItem('playbk_openai_key') || 'proxy';

  try {
    // Step 1 — Whisper transcription
    const formData = new FormData();
    formData.append('file', blob, 'audio.' + ext);
    formData.append('model', 'whisper-1');
    formData.append('language', 'en');

    const whisperResp = await fetch('/api/whisper', {
      method: 'POST',
      body: formData
    });

    if (!whisperResp.ok) {
      const err = await whisperResp.json();
      throw new Error(err.error?.message || 'Whisper error');
    }

    const whisperData = await whisperResp.json();
    const transcript  = (whisperData.text || '').trim();

    if (!transcript) {
      showTalkStatus(fieldPath, 'Nothing heard — try again');
      stopTalk();
      return;
    }

    // Step 2 — Claude extraction
    showTalkStatus(fieldPath, '⏳ Extracting…');
    await processTalk(fieldPath, transcript);

  } catch(err) {
    showTalkStatus(fieldPath, '⚠ ' + err.message);
    stopTalk();
  }
}

async function processTalk(fieldPath, transcript) {
  const oppName  = opp() ? opp().name : 'unknown';
  const firmType = d().snapshot.firmType || 'unknown';
  const context  = talkContext(fieldPath);

  const prompt = `You are an expert B2B sales coach helping an AE document their opportunity in real time.

The AE just said this about their deal:
"${transcript}"

Field context: ${context}
Opportunity: ${oppName} | Firm type: ${firmType}

Your job:
1. Extract a clean, concise value for this field from what was said (1-3 sentences max, factual, no fluff)
2. Identify the single most important follow-up question based on what was said AND what seems missing

Return ONLY valid JSON:
{
  "extracted": "the clean extracted value for the field",
  "question": "one specific follow-up question the AE should answer next (max 15 words, conversational)"
}

If nothing relevant was said for this field, return { "extracted": "", "question": "" }`;

  try {
    const resp = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 400,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);

    const raw    = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());

    if (parsed.extracted) {
      setDeep(fieldPath, parsed.extracted);
      const ta = document.querySelector(`[data-f="${fieldPath}"]`);
      if (ta) ta.value = parsed.extracted;
      showTalkStatus(fieldPath, '');
      if (parsed.question) {
        const safeId  = fieldPath.replace(/\./g, '_');
        const statusEl = document.getElementById('ts_' + safeId);
        if (statusEl) {
          statusEl.innerHTML = `<div class="talk-coaching"><div><strong>Follow-up</strong>${parsed.question}</div></div>`;
        }
      }
    } else {
      showTalkStatus(fieldPath, 'Nothing clear extracted — try again with more detail');
    }
  } catch(err) {
    showTalkStatus(fieldPath, '⚠ ' + err.message);
  } finally {
    stopTalk();
  }
}

function showTalkStatus(fieldPath, msg) {
  const safeId = fieldPath.replace(/\./g, '_');
  const el = document.getElementById('ts_' + safeId);
  if (!el) return;
  if (msg && !msg.startsWith('<')) {
    el.textContent = msg;
  } else if (!msg) {
    if (!el.querySelector('.talk-coaching')) el.textContent = '';
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) { opps = [{ id: 'example_meridian', name: 'Meridian Capital Partners', currentSlide: 1, openMedd: new Set(['economic_buyer']), data: buildExampleOpp(), coaching: buildExampleCoaching(), coachingGeneratedAt: Date.now(), updatedAt: Date.now() }]; currentOpp = 0; showDashboard = true; render(); updateLogCount(); return; }

    if (saved.opps && saved.opps.length) {
      opps = saved.opps.map(o => ({
        ...o,
        openMedd: new Set(o.openMedd || ['metrics']),
        // Ensure freshData fills any fields added since last save
        data: { ...freshData(), ...o.data,
          meddpicc: { meddAnswers:{}, meddNotes:{}, gapOverrides:{__manual:[]}, ...(o.data.meddpicc||{}) },
          accountpov: { ...freshData().accountpov, ...(o.data.accountpov || o.data.pov || {}) },

          opppov: { ...freshData().opppov, ...(o.data.opppov || {}) },
          map: { rows:[], topAsk:'', lastEngagement:'', nextTouch:'', ...(o.data.map||{}) },
          calls: o.data.calls || []

      }));
      currentOpp = Math.min(saved.currentOpp || 0, opps.length - 1);
      showDashboard = saved.showDashboard !== false;
      showPipeline  = saved.showPipeline  || false;
    }
  } catch(e) { /* corrupted state — start fresh */ }
  render();
  updateLogCount();
}

// ── Backup / Restore ──────────────────────────────────────────
// Manual JSON export/import of full app state. Offline safety net
// and portability path; survives into the Supabase migration.
function backupToFile() {
  try {
    const payload = {
      _format: 'playbk-backup',
      _version: 1,
      exportedAt: new Date().toISOString(),
      state: JSON.parse(localStorage.getItem(STATE_KEY) || 'null'),
      log:   JSON.parse(localStorage.getItem('eleven_opp_log') || '[]'),
      collapsedBranches: JSON.parse(localStorage.getItem('playbk_collapsed_branches') || '[]')
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    a.href = url;
    a.download = 'playbk_backup_' + stamp + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) {
    showModal({ title: 'Backup failed', desc: e.message, confirmLabel: 'OK', onConfirm: () => {} });
  }
}

function restoreFromFile(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = ''; // reset so the same file can be re-selected later
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); }
    catch { showModal({ title: 'Restore failed', desc: 'That file is not valid JSON.', confirmLabel: 'OK', onConfirm: () => {} }); return; }

    // Accept either our wrapped backup format, or a bare state object as a fallback
    const isWrapped = parsed && parsed._format === 'playbk-backup';
    const hasBareState = parsed && parsed.opps && Array.isArray(parsed.opps);
    if (!isWrapped && !hasBareState) {
      showModal({ title: 'Restore failed', desc: 'This does not look like a Playbk backup file.', confirmLabel: 'OK', onConfirm: () => {} });
      return;
    }

    const oppCount = isWrapped ? (parsed.state?.opps?.length || 0) : (parsed.opps?.length || 0);
    showModal({
      title: 'Restore from backup?',
      desc: `This will replace all current deals and pipeline with the backup (${oppCount} deal${oppCount === 1 ? '' : 's'}). This cannot be undone.`,
      confirmLabel: 'Replace & restore',
      onConfirm: () => {
        try {
          if (isWrapped) {
            if (parsed.state) localStorage.setItem(STATE_KEY, JSON.stringify(parsed.state));
            localStorage.setItem('eleven_opp_log', JSON.stringify(parsed.log || []));
            localStorage.setItem('playbk_collapsed_branches', JSON.stringify(parsed.collapsedBranches || []));
          } else {
            localStorage.setItem(STATE_KEY, JSON.stringify(parsed));
          }
          // Rehydrate in-memory state from the freshly written keys
          _collapsedBranches = (() => { try { return new Set(JSON.parse(localStorage.getItem('playbk_collapsed_branches') || '[]')); } catch { return new Set(); } })();
          loadState();
          updateLogCount();
        } catch(e) {
          showModal({ title: 'Restore failed', desc: e.message, confirmLabel: 'OK', onConfirm: () => {} });
        }
      }
    });
  };
  reader.onerror = () => showModal({ title: 'Restore failed', desc: 'Could not read the file.', confirmLabel: 'OK', onConfirm: () => {} });
  reader.readAsText(file);
}

/* ── Deal Conviction ─────────────────────────────── */
function getConviction() {
  if (!d().conviction) d().conviction = { deal: null, win: null, play: null, note: '' };
  return d().conviction;
}

function setConviction(key, val) {
  getConviction(); // ensures d().conviction is initialised before setDeep
  const current = d().conviction[key];
  if (current === val) {
    // deselect
    setDeep('conviction.' + key, null);
  } else {
    setDeep('conviction.' + key, val);
    if (val === 'no') showConvictionModal(key);
  }
  render();
}

function convictionStatus() {
  const c = getConviction();
  const answers = [c.deal, c.win, c.play];
  if (answers.every(a => a === 'yes'))   return 'green';
  if (answers.some(a => a === 'no'))     return 'red';
  if (answers.some(a => a !== null))     return 'amber';
  return 'none';
}

function convictionLabel() {
  const st = convictionStatus();
  if (st === 'green') return 'Convicted';
  if (st === 'red')   return 'Walk Away?';
  if (st === 'amber') return 'Uncertain';
  return 'Not set';
}

function renderConvictionCard() {
  const el = document.getElementById('convictionCard');
  if (el) el.outerHTML = buildConvictionCard();
}

function renderConvictionSidebar() {
  const el = document.getElementById('sidebarConviction');
  if (el) {
    const st = convictionStatus();
    el.className = `conviction-dot ${st}`;
    const lbl = el.nextElementSibling;
    if (lbl) lbl.textContent = convictionLabel();
  }
}

    <span class="conviction-badge ${st}">${badge}</span>
  </div>
  <div style="display:flex;flex-direction:row;align-items:center;flex-wrap:nowrap;margin-bottom:10px;overflow-x:auto">${qRow}</div>
  <div class="talk-wrap"><textarea class="field-input" rows="2" style="font-size:12px" data-f="conviction.note" placeholder="Conviction note — what's your gut read on this deal?" oninput="setDeep('conviction.note',this.value);saveAll()">${esc(c.note || '')}</textarea>${mic}</div>
  <div class="talk-status" id="ts_conviction_note"></div>
</div>`;
}

function showConvictionModal(key) {
  // Remove any existing modal
  const existing = document.getElementById('convictionModalOverlay');
  if (existing) existing.remove();

  const label = key === 'deal' ? 'Is there a deal?' : key === 'win' ? 'Can we win?' : 'Should we play?';
  const overlay = document.createElement('div');
  overlay.className = 'conviction-modal-overlay';
  overlay.id = 'convictionModalOverlay';
  overlay.innerHTML = `<div class="conviction-modal">
  <div class="conviction-modal-title">You answered No — "${label}"</div>
  <div class="conviction-modal-sub">What would need to be true for this to change? Talk it through or type it.</div>
  <div class="talk-wrap"><textarea class="field-input" rows="3" id="convictionModalTA" placeholder="e.g. We'd need the CFO in the room and budget confirmed before Q3…" style="font-size:13px"></textarea><button class="talk-btn" onclick="startTalkModal()" title="Talk this field" tabindex="-1"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23" stroke="currentColor" stroke-width="2" fill="none"/><line x1="8" y1="23" x2="16" y2="23" stroke="currentColor" stroke-width="2" fill="none"/></svg></button></div>
  <div class="talk-status" id="ts_conviction_modal"></div>
  <div class="conviction-modal-actions">
    <button class="conviction-modal-cancel" onclick="closeConvictionModal()">Dismiss</button>
    <button class="conviction-modal-save" onclick="saveConvictionModal()">Save note</button>
  </div>
</div>`;
  document.body.appendChild(overlay);
}

function closeConvictionModal() {
  const el = document.getElementById('convictionModalOverlay');
  if (el) el.remove();
}

function saveConvictionModal() {
  // Read from textarea directly OR from voice-transcribed _modalDraft
  const ta = document.getElementById('convictionModalTA');
  const draft = (d().conviction && d().conviction._modalDraft) || '';
  const text = (ta && ta.value.trim()) || draft;
  if (text) {
    const existing = getConviction().note || '';
    const separator = existing ? '\n' : '';
    setDeep('conviction.note', existing + separator + text);
    // Clear the temp draft
    if (d().conviction) delete d().conviction._modalDraft;
    saveAll();
  }
  closeConvictionModal();
  renderConvictionCard();
}

// Voice in modal — wire to modal textarea
function startTalkModal() {
  const btn = document.querySelector('#convictionModalOverlay .talk-btn');
  if (!btn) return;
  const fakeEvent = { preventDefault: ()=>{}, stopPropagation: ()=>{}, currentTarget: btn };
  startTalk(fakeEvent, 'conviction._modalDraft');
}


/* ── Stakeholder voice helper ─────────────────────────────────── */
async function startStkTalk(e, idx, field) {
  e.preventDefault();
  e.stopPropagation();
  const btn = e.currentTarget;
  const fakeFieldPath = 'stk_' + idx + '_' + field;

  if (_talkActive && _talkField === fakeFieldPath) { stopRecording(); return; }
  if (_talkActive) stopTalk();

  const key = getOpenAIKey();
  if (!key) return;

  try {
    _talkStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(err) {
    showStkTalkStatus(idx, field, 'Mic access denied'); return;
  }

  _talkField  = fakeFieldPath;
  _talkBtn    = btn;
  _talkActive = true;
  _audioChunks = [];

  btn.classList.add('recording');
  showStkTalkStatus(idx, field, '🔴 Recording… tap mic to stop');

  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
  _mediaRecorder = new MediaRecorder(_talkStream, { mimeType });
  _mediaRecorder.ondataavailable = e => { if (e.data.size > 0) _audioChunks.push(e.data); };
  _mediaRecorder.onstop = async () => {
    const ext  = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(_audioChunks, { type: mimeType });
    await transcribeAndProcessStk(idx, field, blob, ext);
  };
  _mediaRecorder.start();
}

async function transcribeAndProcessStk(idx, field, blob, ext) {
  if (_talkBtn) _talkBtn.classList.add('processing');
  showStkTalkStatus(idx, field, '⏳ Transcribing…');

  const key = localStorage.getItem('playbk_openai_key') || 'proxy';

  try {
    const formData = new FormData();
    formData.append('file', blob, 'audio.' + ext);
    formData.append('model', 'whisper-1');
    formData.append('language', 'en');

    const whisperResp = await fetch('/api/whisper', {
      method: 'POST', body: formData
    });
    if (!whisperResp.ok) throw new Error('Whisper error');
    const transcript = ((await whisperResp.json()).text || '').trim();
    if (!transcript) { showStkTalkStatus(idx, field, 'Nothing heard — try again'); stopTalk(); return; }

    showStkTalkStatus(idx, field, '⏳ Extracting…');

    const stk = d().stakeholders[idx] || {};
    const prompt = `You are a B2B sales coach. The AE just described what a stakeholder personally gains from this deal succeeding.
Stakeholder: ${stk.name || 'unknown'} (${stk.role || 'unknown'}, ${stk.title || 'unknown'})
AE said: "${transcript}"
Extract a clean 1-2 sentence personal win for this stakeholder.
Return ONLY JSON: { "extracted": "the personal win", "question": "one short follow-up question max 15 words" }`;

    const resp = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 300, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);
    const parsed = JSON.parse(data.content.filter(b => b.type === 'text').map(b => b.text).join('').replace(/```json|```/g,'').trim());

    if (parsed.extracted) {
      setStkField(idx, field, parsed.extracted);
      const ta = document.querySelector(`[data-stk="${idx}.${field}"]`);
      if (ta) ta.value = parsed.extracted;
      showStkTalkStatus(idx, field, '');
      if (parsed.question) {
        const el = document.getElementById('ts_stk_' + idx + '_' + field);
        if (el) el.innerHTML = `<div class="talk-coaching"><div><strong>Follow-up</strong> ${parsed.question}</div></div>`;
      }
    } else {
      showStkTalkStatus(idx, field, 'Nothing clear extracted — try again');
    }
  } catch(err) {
    showStkTalkStatus(idx, field, '⚠ ' + err.message);
  } finally {
    stopTalk();
  }
}

function showStkTalkStatus(idx, field, msg) {
  const el = document.getElementById('ts_stk_' + idx + '_' + field);
  if (!el) return;
  if (msg && !msg.startsWith('<')) el.textContent = msg;
  else if (!msg) { if (!el.querySelector('.talk-coaching')) el.textContent = ''; }
}

</script>
